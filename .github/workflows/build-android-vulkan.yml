name: Android ARM64 Vulkan port probe
run-name: CSE WARP Android V17.031 — build ${{ github.run_number }}
on:
  push:
    branches: ['test/android-vulkan-arm64']
    paths: ['experiments/android-vulkan/**', 'v16/**', 'v17/**', 'engine/**', 'experiments/2026-10-30-cote-ete-gt/native_v14/**', '.github/workflows/build-android-vulkan.yml', '.github/workflows/qa-android-vulkan.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-vulkan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
        with:
          packages: 'platform-tools'
      - name: Host shader tools and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools spirv-tools
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt 6.10.3 host tools and Android target from current repository
        run: |
          set -euxo pipefail
          python -m pip install 'aqtinstall==3.3.0'
          python -m aqt list-qt all_os android --arch 6.10.3
          python -m aqt list-qt linux desktop --arch 6.10.3
          python -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          python -m aqt install-qt all_os android 6.10.3 "${{ matrix.qt_arch }}" --outputdir "$RUNNER_TEMP/Qt"
          host="$RUNNER_TEMP/Qt/6.10.3/gcc_64"
          target="$RUNNER_TEMP/Qt/6.10.3/${{ matrix.qt_arch }}"
          test -x "$target/bin/qt-cmake"
          test -x "$host/bin/androiddeployqt"
          echo "QT_ROOT_DIR=$target" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$host" >> "$GITHUB_ENV"
      - name: Verify scene archive and compile original Vulkan shaders
        run: python3 experiments/android-vulkan/stage_assets.py "$RUNNER_TEMP/android-package"
      - name: Configure Android real engine
        run: |
          set -euxo pipefail
          "$QT_ROOT_DIR/bin/qt-cmake" -S experiments/android-vulkan -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DQT_HOST_PATH="$QT_HOST_PATH" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-35 -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_ANDROID_ABIS="${{ matrix.abi }}" -DQT_ENABLE_VERBOSE_DEPLOYMENT=ON \
            -DCSE_ANDROID_PACKAGE_DIR="$RUNNER_TEMP/android-package" -DCSE_ANDROID_BUILD_ID="$GITHUB_SHA" \
            2>&1 | tee configure-android.log
      - name: Run isolated Vulkan version policy regression with actual NDK headers
        run: |
          set -euxo pipefail
          inc="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          mkdir -p "$RUNNER_TEMP/vulkan-host-headers"
          cp -r "$inc/vulkan" "$inc/vk_video" "$RUNNER_TEMP/vulkan-host-headers/"
          g++ -std=c++17 -Wall -Wextra -Werror -I "$RUNNER_TEMP/vulkan-host-headers" -I v17/vulkan \
            experiments/android-vulkan/version_policy_smoke.cpp -o "$RUNNER_TEMP/version-policy"
          "$RUNNER_TEMP/version-policy"
      - name: Preflight generated Qt deployment settings
        run: |
          set -euxo pipefail
          python3 experiments/android-vulkan/check_package.py selftest
          python3 experiments/android-vulkan/check_package.py deployment \
            build-android/android-cse_android_probe-deployment-settings.json "${{ matrix.abi }}" \
            "$RUNNER_TEMP/android-package" 2>&1 | tee deployment-android.log
      - name: Compile core and build diagnostic APK
        run: |
          set -euxo pipefail
          cmake --build build-android --target cse_android_probe --parallel 3 2>&1 | tee build-android.log
          cmake --build build-android --target apk --parallel 2 2>&1 | tee apk-android.log
          apk=build-android/android-build/cse_android_probe.apk
          test -s "$apk"
          python3 experiments/android-vulkan/check_package.py apk "$apk" "${{ matrix.abi }}" "$RUNNER_TEMP/android-package" 2>&1 | tee verify-android.log
          mkdir -p package
          cp "$apk" package/CSE-WARP-Android-V17.031-${{ matrix.abi }}-probe.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee package/badging.txt
          unzip -l "$apk" | tee package/apk-files.txt
          grep -q 'lib/${{ matrix.abi }}/libmoteur3d_v16_core' package/apk-files.txt
          grep -q 'assets/cse/vulkan/raster.vert.spv' package/apk-files.txt
          grep -q 'assets/cse/benchmark-civic/scene.json' package/apk-files.txt
          grep -q "package: name='org.csewarp.androidprobe'" package/badging.txt
          grep -q "sdkVersion:'36'" package/badging.txt
          grep -q "targetSdkVersion:'36'" package/badging.txt
          grep -q "application-debuggable" package/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          printf '%s\n' "$GITHUB_SHA" > package/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.abi }}-apk
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-${{ matrix.abi }}-build-logs
          path: |
            *-android.log
            build-android/android-cse_android_probe-deployment-settings.json
            build-android/android-build/build.gradle
            build-android/android-build/build/reports/problems/problems-report.html
          if-no-files-found: warn
  simulation:
    needs: apk
    if: ${{ needs.apk.result == 'success' }}
    uses: ./.github/workflows/qa-android-vulkan.yml
