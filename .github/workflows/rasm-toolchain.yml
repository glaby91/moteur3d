name: RASM Linux build (QBasic CPC)
on:
  push:
    branches: [qbasic-cpc6128]
    paths:
      - '.github/workflows/rasm-toolchain.yml'
  workflow_dispatch:
jobs:
  assemble-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Build RASM v3.2.4bis
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
          mkdir -p dist
          cp /tmp/rasm-src/rasm.exe dist/rasm
          chmod +x dist/rasm
          file dist/rasm
      - uses: actions/upload-artifact@v4
        with:
          name: qbasic-rasm-linux
          path: dist/rasm
          retention-days: 7
