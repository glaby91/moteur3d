name: Check route30 scene bootstrap on Windows
on:
  push:
    branches: [benchmark/luminosity-audit-v1]
    paths:
      - v17/tools/route30.ps1
      - v17/tools/LANCER_PARCOURS_30S.bat
      - .github/workflows/route30-scene-check.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: v17/tools
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Run the published BAT at 720p on real native swapchains
        shell: powershell
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "CI desktop $bounds (session $((Get-Process -Id $PID).SessionId))"
          if (($bounds.Width -lt 1280 -or $bounds.Height -lt 720) -and (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue)) {
              try { Set-DisplayResolution -Width 1280 -Height 720 -Force -ErrorAction Stop }
              catch { Write-Host "Desktop mode retained: $_" }
          }
          $package = Join-Path $env:RUNNER_TEMP '17 PATCH'
          [IO.Directory]::CreateDirectory($package) | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\bin\*.dll" $package
          Copy-Item "$env:QT_ROOT_DIR\plugins\imageformats" $package -Recurse
          Copy-Item v17/tools/LANCER_PARCOURS_30S.bat $package
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notlike "$env:QT_ROOT_DIR*" }) -join ';'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Push-Location $package
          try {
              if (Test-Path 'benchmark-civic') { throw 'Cold launch must start with no scene.' }
              & $env:ComSpec /d /c 'call LANCER_PARCOURS_30S.bat <nul >route.log 2>&1'
              $batCode = $LASTEXITCODE
              $log = Get-Content -LiteralPath 'route.log' -Raw
              Write-Host $log
              if ($log -notmatch 'Telechargement : V17-scene' -or $log -notmatch 'Scene prete :') {
                  throw 'The published BAT did not download and verify the scene.'
              }
              if (Test-Path 'benchmark-civic') { throw 'Installation was modified.' }
              $out = Get-ChildItem 'benchmark-results' -Directory | Select-Object -First 1
              $manifest = Get-Content (Join-Path $out.FullName 'SCENE_VERSION.json') -Raw | ConvertFrom-Json
              $rows = @(Import-Csv (Join-Path $out.FullName 'resultats.csv'))
              if (($rows.backend -join ',') -ne 'DX11,Vulkan,LumaTrace') { throw 'Missing backend.' }
              foreach ($row in $rows) {
                  if ($row.camera -ne 'v7_pool_fresco' -or [double]$row.hour -ne 14.75 -or
                      $row.width -ne '1280' -or $row.height -ne '720' -or
                      $row.presentation -ne 'native_swapchain' -or $row.vsync -ne 'on') {
                      throw "Wrong native route configuration for $($row.backend)."
                  }
                  if ($row.status -eq 'ok') {
                      if ($row.readback_buffers -ne '0' -or [int]$row.frames_completed_30s -lt 1 -or
                          [int]$row.frames_started -lt [int]$row.frames_completed_30s -or
                          [double]$row.elapsed_s -lt 30 -or [double]$row.mean_render_ms -le 0 -or
                          [Math]::Abs([double]$row.fps_30s - [int]$row.frames_completed_30s / 30.0) -gt 0.001) {
                          throw "Invalid 30-second direct presentation measurement for $($row.backend)."
                      }
                  } elseif ($row.backend -ne 'Vulkan' -or $row.status -ne 'error' -or $row.fps_30s -or
                            $row.error -notmatch 'vulkan-1.dll unavailable|No hardware GPU exposing Vulkan|No Vulkan GPU/driver|create instance.*(-9|INCOMPATIBLE_DRIVER)') {
                      throw "Unexpected native presentation failure for $($row.backend): $($row.error)"
                  }
              }
              $allOk = @($rows | Where-Object status -ne 'ok').Count -eq 0
              if (($batCode -eq 0) -ne $allOk) { throw 'BAT exit code disagrees with CSV.' }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip = [IO.Compression.ZipFile]::OpenRead($out.FullName + '.zip')
              try {
                  if (($zip.Entries.Name -notcontains 'SCENE_VERSION.json') -or
                      ($zip.Entries.Name -notcontains 'resultats.csv')) { throw 'Incomplete result ZIP.' }
              } finally { $zip.Dispose() }
              "Real BAT, official scene $($manifest.revision) and 1280x720 native presentation." | Add-Content $env:GITHUB_STEP_SUMMARY
              $rows | Select-Object backend,status,frames_completed_30s,readback_buffers,error | Format-Table -AutoSize
          } finally { Pop-Location }
          exit 0
      - name: Check scene reuse and repair with a broken installed scene
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\v17\tools\route30.ps1"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Join-Path $env:RUNNER_TEMP '17 PATCH'
          $cache = Join-Path $package 'benchmark-tools\archives'
          $local = Join-Path $package 'benchmark-civic'
          [IO.Directory]::CreateDirectory($local) | Out-Null
          $broken = Join-Path $local 'scene.json'
          [IO.File]::WriteAllText($broken, 'incomplete local scene')
          $stored = Get-ChildItem $cache -Filter 'V17-scene-*.zip' | Select-Object -First 1
          $time = $stored.LastWriteTimeUtc
          $size = $stored.Length
          $reuse = Get-RouteScene $cache (Join-Path $env:RUNNER_TEMP 'verify reused')
          if (!(Test-Path -LiteralPath $reuse.Path) -or (Get-Item $stored.FullName).LastWriteTimeUtc -ne $time) {
              throw 'Verified archive was not reused.'
          }
          [IO.File]::WriteAllText($stored.FullName, 'truncated cache')
          $repair = Get-RouteScene $cache (Join-Path $env:RUNNER_TEMP 'verify repaired')
          if (!(Test-Path -LiteralPath $repair.Path) -or (Get-Item $stored.FullName).Length -ne $size -or
              (Get-Content -LiteralPath $broken -Raw) -cne 'incomplete local scene') {
              throw 'Cache repair or installed scene isolation failed.'
          }
