name: Build QEDIT B005 expanded tokens
on:
  push:
    branches: [qedit-v0.4.2-b005-language-profile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and validate
        run: |
          set -euo pipefail
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT_V042_B005.ROM
          test "$(stat -c%s QEDIT_V042_B005.ROM)" -eq 16384
          python3 -c 'b=open("QEDIT_V042_B005.ROM","rb").read(); n=len(b.rstrip(bytes([255]))); print("USED_BYTES",n,"FREE_BYTES",len(b)-n)'
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-v0.4.2-B005-EXTENDED-TOKENS
          path: retro/cpc6128-qbasic/editor/QEDIT_V042_B005.ROM
          if-no-files-found: error
