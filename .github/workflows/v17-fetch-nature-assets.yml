name: V17 - Recuperation assets GLB CC0 vegetaux medium poly
run-name: V17 assets pilotes CC0 - fichiers originaux GLB
on:
  push:
    branches: [render/v17-facade-pots-warp-261112]
    paths: [.github/workflows/v17-fetch-nature-assets.yml]
permissions:
  contents: read
jobs:
  download:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download source GLB files unchanged and attempt two approved Poly Haven flowers
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import urllib.request, urllib.parse, json, time
          root=Path('nature_glb');root.mkdir(exist_ok=True)
          base='https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/environment/vegetation/polypizza-stylized-nature-gltf/'
          names=['Tree.glb','Tree-QVOop92WmG.glb','Pine.glb','Pine-79gmlLnweB.glb',
                 'Twisted Tree.glb','Flower Group.glb','Flower Single.glb',
                 'Bush with Flowers.glb','Grass Wispy.glb','Grass.glb']
          def fetch(url, dest):
              req=urllib.request.Request(url,headers={'User-Agent':'CSE-WARP-asset-validation/1.0'})
              with urllib.request.urlopen(req,timeout=80) as response:raw=response.read()
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw);return len(raw)
          for name in names:
              url=base+urllib.parse.quote(name)
              print('SOURCE',name,fetch(url,root/name),flush=True)
          for name in ['flower_empodium','flower_gazania']:
              try:
                  u='https://api.polyhaven.com/files/'+name
                  req=urllib.request.Request(u,headers={'User-Agent':'CSE-WARP-asset-validation/1.0'})
                  with urllib.request.urlopen(req,timeout=35) as f:data=json.load(f)
                  print('POLYHAVEN_FILES',name,list(data),flush=True)
                  gltf=data.get('gltf',{})
                  resolution=next((k for k in ('1k','2k','4k') if k in gltf),None)
                  if not resolution:continue
                  entry=gltf[resolution].get('gltf')
                  if not entry:continue
                  folder=root/('polyhaven_'+name);folder.mkdir(exist_ok=True)
                  def walk(spec, filename=None):
                      if isinstance(spec,dict) and 'url' in spec:
                          url=spec['url']
                          dest=folder/(filename or url.split('?')[0].split('/')[-1])
                          print('POLYFILE',name,dest.name,fetch(url,dest),flush=True)
                          inc=spec.get('include',{})
                          if isinstance(inc,dict):
                              for n,v in inc.items():walk(v,n)
                          elif isinstance(inc,list):
                              for v in inc:walk(v)
                  walk(entry)
              except Exception as exc:
                  print('POLYHAVEN_UNAVAILABLE',name,repr(exc),flush=True)
          manifest={'license':'CC0 1.0','source':'Quaternius Stylized Nature MegaKit (via petroulacl/fps-buildings-env-kit)',
                    'models':names,'polyhavenFolders':[p.name for p in root.iterdir() if p.is_dir()]}
          (root/'ASSET-SOURCES.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          '@ | Set-Content fetch.py -Encoding utf8
          python fetch.py
          if($LASTEXITCODE -ne 0){throw 'Asset download failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: V17-QUATERNIUS-GLB-CC0-ET-FLEURS-POLYHAVEN
          path: nature_glb/
          if-no-files-found: error
          retention-days: 14
