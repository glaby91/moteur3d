name: CSE WARP V17.031 — Escargot Object 002 lab
on:
  push:
    branches: [experiment/v17-escargot-object-002]
    paths:
      - '.github/workflows/escargot-object-002.yml'
      - 'v17/escargot/**'
      - 'v17/tools/escargot*'
      - 'v17/tests/escargot_smoke.cpp'
      - 'v17/CMakeLists.txt'
      - 'v17/moteur3d_v17_*.cpp'
      - 'v17/moteur3d_v17_render.h'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: escargot-object-002
  cancel-in-progress: true
jobs:
  windows-ab:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Synthetic numerical projection and visibility
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force object-results | Out-Null
          node v17/escargot/object_sim.mjs object-results/synthetic.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and run standalone visibility test
        shell: pwsh
        run: |
          cmake -S v17/escargot/object_visibility_test -B build-mask -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-mask --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ".\build-mask\Release\object_visibility_test.exe" | Tee-Object object-results/visibility-test.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download exact scene V17.634
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "escargot-scene.zip"
          $root = Join-Path $env:RUNNER_TEMP "escargot-scene"
          Invoke-WebRequest "https://github.com/glaby91/moteur3d-scene/releases/download/scene-reflect-V17.634/V17-scene.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "f975639311e5b5d48ae996ac1f4f986994b232befb29617290f51bdf2bfbb703") { throw "Scene digest mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          "ESC_SCENE=$root/benchmark-civic" >> $env:GITHUB_ENV
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install Vulkan SDK for exploration application
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.309.0'
          install_runtime: false
          cache: true
          stripdown: true
          install_swiftshader: false
      - name: Compile object projection diagnostic
        shell: pwsh
        run: |
          cmake -S v17 -B build-escargot -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DV17_SCENE_SOURCE_DIR=$env:ESC_SCENE" -DM3D_REQUIRE_VULKAN=ON "-DV17_CI_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER" "-DV17_GIT_SHA=$env:GITHUB_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-escargot --config Release --target v17_escargot_object_lab v17_escargot_object_generic v17_escargot_object_opt v17_escargot_object_combined v17_escargot_object_compact v17_escargot_object_global --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real scene one-layer diagnostic
        shell: pwsh
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_lab.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing diagnostic binaries" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Generic discovery and geometric visibility A-B
        shell: pwsh
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_generic.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing generic diagnostic binaries" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results"
          $rc = $LASTEXITCODE
          if (Test-Path object-results/generic-summary.json) { Get-Content object-results/generic-summary.json }
          if ($rc) { throw "Generic geometry validation failed: $rc" }
      - name: Optimization sweep (unchanged reference)
        shell: pwsh
        timeout-minutes: 35
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_opt.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing optimization diagnostic" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results"
          $rc = $LASTEXITCODE
          if (Test-Path object-results/optimization-summary.json) {
            $r = Get-Content object-results/optimization-summary.json -Raw | ConvertFrom-Json
            $r | Select-Object testedPairPoses,geometryErrors,cropErrors,meshErrors | ConvertTo-Json
            $r.variants | Group-Object variant | ForEach-Object {
              [pscustomobject]@{variant=$_.Name;cases=$_.Count;totalMedianMs=($_.Group | Measure-Object medianMs -Sum).Sum;fallbackRays=($_.Group | Measure-Object fallbackRays -Sum).Sum;falseVisible=($_.Group | Measure-Object falseVisible -Sum).Sum;falseHidden=($_.Group | Measure-Object falseHidden -Sum).Sum;unknown=($_.Group | Measure-Object unknown -Sum).Sum;geometryResolved=($_.Group | Measure-Object geometryResolved -Sum).Sum}
            } | ConvertTo-Json
            $r.crop | ConvertTo-Json -Depth 4
            $r.discoveryReuse | ConvertTo-Json -Depth 4
            $r.allFaces | ConvertTo-Json -Depth 4
          }
          if ($rc) { throw "Optimization parity failed: $rc" }
      - name: Combined crop and Narrow16 paired scaling test
        shell: pwsh
        timeout-minutes: 30
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_combined.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing combined diagnostic" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results"
          $rc = $LASTEXITCODE
          if (Test-Path object-results/combined-summary.json) {
            $r = Get-Content object-results/combined-summary.json -Raw | ConvertFrom-Json
            $r | Select-Object pairPoseResolutionCases,measuredRuns,coverageErrors,maskErrors,uvErrors,images | ConvertTo-Json
            $r.cases | Group-Object width,variant | ForEach-Object {
              [pscustomobject]@{group=$_.Name;cases=$_.Count;totalMs=($_.Group | Measure-Object medianTotalMs -Sum).Sum;projectionMs=($_.Group | Measure-Object medianProjectionMs -Sum).Sum;visibilityMs=($_.Group | Measure-Object medianVisibilityMs -Sum).Sum;fallbackRays=($_.Group | Measure-Object fallbackRays -Sum).Sum;geometryResolved=($_.Group | Measure-Object geometryResolved -Sum).Sum;maskErrors=($_.Group | Measure-Object maskErrors -Sum).Sum;coverageErrors=($_.Group | Measure-Object coverageErrors -Sum).Sum;uvErrors=($_.Group | Measure-Object uvErrors -Sum).Sum}
            } | ConvertTo-Json
          }
          if ($rc) { throw "Combined parity failed: $rc" }
      - name: Compact footprint and prepared geometry scaling test
        shell: pwsh
        timeout-minutes: 35
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_compact.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing compact diagnostic" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          New-Item -ItemType Directory -Force object-results/compact | Out-Null
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results/compact"
          $rc = $LASTEXITCODE
          if (Test-Path object-results/compact/compact-summary.json) {
            $r = Get-Content object-results/compact/compact-summary.json -Raw | ConvertFrom-Json
            $r | Select-Object pairPoseResolutionCases,measuredRuns,coverageErrors,maskErrors,uvErrors,images,chartPreparationMs | ConvertTo-Json
            $r.cases | Group-Object width,variant | ForEach-Object {
              [pscustomobject]@{group=$_.Name;cases=$_.Count;totalMs=($_.Group | Measure-Object medianTotalMs -Sum).Sum;projectionMs=($_.Group | Measure-Object medianProjectionMs -Sum).Sum;visibilityMs=($_.Group | Measure-Object medianVisibilityMs -Sum).Sum;storageBytes=($_.Group | Measure-Object storageBytes -Sum).Sum;fallbackRays=($_.Group | Measure-Object fallbackRays -Sum).Sum;geometryResolved=($_.Group | Measure-Object geometryResolved -Sum).Sum;maskErrors=($_.Group | Measure-Object maskErrors -Sum).Sum;coverageErrors=($_.Group | Measure-Object coverageErrors -Sum).Sum;uvErrors=($_.Group | Measure-Object uvErrors -Sum).Sum}
            } | ConvertTo-Json
          }
          if ($rc) { throw "Compact parity failed: $rc" }
      - name: Global all-object all-face reflection parity
        shell: pwsh
        timeout-minutes: 35
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_object_global.exe | Select-Object -First 1
          if (!$core -or !$exe) { throw "Missing global diagnostic" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          New-Item -ItemType Directory -Force object-results/global | Out-Null
          & $exe.FullName "$env:ESC_SCENE/scene.json" "$PWD/object-results/global"
          $rc = $LASTEXITCODE
          if (Test-Path object-results/global/global-summary.json) {
            $r = Get-Content object-results/global/global-summary.json -Raw | ConvertFrom-Json
            $r | Select-Object frameCases,measuredRuns,errors,images | ConvertTo-Json
            $r.cases | Group-Object width,variant | ForEach-Object {
              [pscustomobject]@{group=$_.Name;cases=$_.Count;totalMs=($_.Group | Measure-Object totalMs -Sum).Sum;primaryMs=($_.Group | Measure-Object primaryMs -Sum).Sum;secondaryMs=($_.Group | Measure-Object secondaryMs -Sum).Sum;discoveryMs=($_.Group | Measure-Object discoveryMs -Sum).Sum;receivers=($_.Group | Measure-Object receivers -Sum).Sum;sources=($_.Group | Measure-Object sources -Sum).Sum;multiPrimitiveSources=($_.Group | Measure-Object multiPrimitiveSources -Sum).Sum;reflectedPixels=($_.Group | Measure-Object reflectedPixels -Sum).Sum}
            } | ConvertTo-Json
          }
          if ($rc) { throw "Global parity failed: $rc" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Escargot-object-002-diagnostics
          path: object-results/
          if-no-files-found: warn
