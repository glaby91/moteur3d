name: Export Energetik three-seat row preview

on:
  push:
    branches:
      - pripiat
    paths:
      - experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_cinema_seat.js
      - experiments/2026-10-30-cote-ete-gt/native_v14/scene_energetik_seat_preview.js
      - experiments/2026-10-30-cote-ete-gt/native_v14/export_energetik_seat_manifest.js
      - experiments/2026-10-30-cote-ete-gt/native_v14/energetik_seat_physics_profiles.json
      - experiments/2026-10-30-cote-ete-gt/native_v14/source_v1314.html
      - experiments/2026-10-30-cote-ete-gt/native_v14/gltf_scene_import.js
      - experiments/2026-10-30-cote-ete-gt/native_v14/assets/orange_texturecan/orange_peel_512.m3dpbr
      - experiments/2026-10-30-cote-ete-gt/native_v14/assets/1970s-coupe/classic_body.rgb565mip
      - experiments/2026-10-30-cote-ete-gt/native_v14/assets/1970s-coupe/classic_tire.rgb565mip
      - .github/workflows/export-energetik-seat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-seat:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export three-seat row scene
        shell: bash
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: |
          M3D_SKIP_IMPORTED_CAR=1 node export_scene.js source_v1314.html scene_energetik_seat_preview.bin scene_energetik_seat_preview.js
          node export_energetik_seat_manifest.js scene_energetik_seat_preview.assets.json

      - name: Package load instructions
        shell: bash
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: |
          cat > scene_energetik_seat_preview.txt <<'EOF'
          Rangée de trois sièges rabattables du Palais Energetik

          Ouvrir le moteur déjà installé, puis choisir Scène > Ouvrir une scène…
          et sélectionner scene_energetik_seat_preview.bin.
          Le fichier est autonome : il contient trois sièges, un tube de fixation commun, des montants en bois, le sol de présentation et les matériaux.
          Aucun recompile du moteur n'est requis pour modifier le modèle et réexporter cette scène.
          Le fichier .assets.json décrit les composants, les pivots des assises et les familles de matériaux pour une future physique; le moteur actuel ne simule pas encore ces propriétés.
          EOF

      - name: Upload standalone scene
        uses: actions/upload-artifact@v4
        with:
          name: energetik-three-seat-row-preview
          path: |
            experiments/2026-10-30-cote-ete-gt/native_v14/scene_energetik_seat_preview.bin
            experiments/2026-10-30-cote-ete-gt/native_v14/scene_energetik_seat_preview.assets.json
            experiments/2026-10-30-cote-ete-gt/native_v14/scene_energetik_seat_preview.txt
          if-no-files-found: error
          retention-days: 30
