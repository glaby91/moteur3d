name: Build QEDIT versioned ROM
on:
  push:
    branches: [qedit-v0.4.2-versioned-rom]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble and name ROM
        run: |
          set -euo pipefail
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT_V042_B001.ROM | tee build-versioned.log
          test "$(stat -c%s QEDIT_V042_B001.ROM)" -eq 16384
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-v0.4.2-B001-ROM
          path: |
            retro/cpc6128-qbasic/editor/QEDIT_V042_B001.ROM
            retro/cpc6128-qbasic/editor/build-versioned.log
          if-no-files-found: error
