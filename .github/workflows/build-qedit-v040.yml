name: QEDIT v0.4 tokenized ROM (CPC6128)
on:
  push:
    branches: [qbasic-cpc6128]
    paths:
      - '.github/workflows/build-qedit-v040.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source update and include banked token engine
        shell: bash
        run: |
          set -euo pipefail
          STAGE=retro/cpc6128-qbasic/editor/QEDIT_v040_stage.tar.gz.b64
          if test -f "$STAGE"; then
            base64 --decode "$STAGE" | tar xz -C .
            patch -p1 < QEDIT_v040.patch
            rm "$STAGE" QEDIT_v040.patch
          fi
          grep -q 'editor ROM v0.4.0' retro/cpc6128-qbasic/editor/QEDIT_ROM.asm
          grep -q 'TOKEN_COUNT EQU 66' retro/cpc6128-qbasic/editor/QEDIT_V04_CORE.asm
          grep -q 'MAX_LINES       EQU 1500' retro/cpc6128-qbasic/editor/QEDIT_ROM.asm
      - name: Build RASM v3.2.4bis and verify ROM hash
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT.ROM | tee build.log
          test "$(stat -c%s QEDIT.ROM)" -eq 16384
          echo "0de84c30a21f95c4bd653a7852691a0bfe786431e41aa4605d190e1a1e5f056f  QEDIT.ROM" | sha256sum -c -
      - name: Static regression checks
        run: python3 retro/cpc6128-qbasic/tests/test_token_model.py
      - name: Publish beta source and binary to qbasic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A retro/cpc6128-qbasic/editor
          if ! git diff --cached --quiet; then
            git commit -m "feat(qbasic): publish v0.4 beta tokenized banked 1500-line editor"
            git push origin HEAD:qbasic-cpc6128
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-CPC6128-v0.4.0-beta
          path: |
            retro/cpc6128-qbasic/editor/QEDIT_ROM.asm
            retro/cpc6128-qbasic/editor/QEDIT_V04_CORE.asm
            retro/cpc6128-qbasic/editor/QEDIT.ROM
            retro/cpc6128-qbasic/editor/build.log
          if-no-files-found: error
