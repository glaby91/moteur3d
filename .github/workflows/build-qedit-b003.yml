name: Build QEDIT v0.4.2 B003 diagnostics
on:
  push:
    branches: [qedit-v0.4.2-b003-line-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble
        run: |
          set -euo pipefail
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT_V042_B003.ROM | tee build-b003.log
          test "$(stat -c%s QEDIT_V042_B003.ROM)" -eq 16384
          python3 -c 'p="QEDIT_V042_B003.ROM"; b=open(p,"rb").read(); used=len(b.rstrip(bytes([255]))); print(f"CODE_ET_DONNEES={used} octets; REMPLISSAGE={len(b)-used} octets; CODE_FIN={hex(0xC000+used)}")'
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-v0.4.2-B003-DIAGNOSTICS
          path: |
            retro/cpc6128-qbasic/editor/QEDIT_V042_B003.ROM
            retro/cpc6128-qbasic/editor/build-b003.log
          if-no-files-found: error
