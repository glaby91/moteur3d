name: Z-Reflect R001 — scene V17.629-42
on:
  push:
    branches: [feature/v17-csp001-zreflect-r001]
    paths:
      - '.github/workflows/zreflect-scene-629.yml'
      - 'v17/tools/cse_scene_precompiler.cpp'
      - 'v17/tools/zreflect_scene_629_report.py'
      - 'v17/config/zreflect-scene-V17.629.json'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/src/m3d_zreflect_*.h'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zreflect-scene-629-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact published scene
        shell: pwsh
        run: |
          $base = "https://github.com/glaby91/moteur3d-scene/releases/download/scene-V17.629-42"
          $root = Join-Path $env:RUNNER_TEMP "zreflect-scene"
          $zip = Join-Path $env:RUNNER_TEMP "V17-scene.zip"
          $manifest = Join-Path $env:RUNNER_TEMP "SCENE_VERSION.json"
          Invoke-WebRequest "$base/V17-scene.zip" -OutFile $zip
          Invoke-WebRequest "$base/SCENE_VERSION.json" -OutFile $manifest
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "8d56480f93a268f8c9028e41fbbb8d6e20a9e3b34e150ec2f296e9b7abb9d9b6") { throw "Scene archive digest mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          python v17/tools/zreflect_scene_629_report.py --archive $zip --manifest $manifest --root $root --engine-commit $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ZREFLECT_ROOT=$root" >> $env:GITHUB_ENV
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure diagnostic targets only
        shell: pwsh
        run: |
          cmake -S v17 -B build-zreflect -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DV17_SCENE_SOURCE_DIR=$env:ZREFLECT_ROOT/benchmark-civic" -DM3D_REQUIRE_VULKAN=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and test native diagnostic
        shell: pwsh
        run: |
          cmake --build build-zreflect --config Release --target cse_scene_precompiler v17_zreflect_catalog_smoke --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-zreflect -C Release -R "^v17_zreflect_catalog_filter$" --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Simulate all authored cameras, no camera cap
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-zreflect -Recurse -Filter cse_scene_precompiler.exe | Select-Object -First 1
          $core = Get-ChildItem build-zreflect -Recurse -Filter moteur3d_v16_core.dll | Select-Object -First 1
          if (!$exe -or !$core) { throw "Missing diagnostic binary" }
          $env:PATH = "$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:M3D_CSP001 = "0"
          & $exe.FullName "$env:ZREFLECT_ROOT/benchmark-civic/scene.json" --catalog-only --policy "v17/config/zreflect-scene-V17.629.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python v17/tools/zreflect_scene_629_report.py --archive "$env:RUNNER_TEMP/V17-scene.zip" --manifest "$env:RUNNER_TEMP/SCENE_VERSION.json" --root "$env:ZREFLECT_ROOT" --engine-commit $env:GITHUB_SHA --output zreflect-report/summary.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:ZREFLECT_ROOT/benchmark-civic/precomputed/zreflect-candidates.json" zreflect-report/
          Copy-Item "$env:ZREFLECT_ROOT/SCENE_VERSION.json" zreflect-report/
          Copy-Item "v17/config/zreflect-scene-V17.629.json" zreflect-report/
          Get-Content zreflect-report/summary.json -TotalCount 40
      - uses: actions/upload-artifact@v6
        with:
          name: ZReflect-V17.629-42-native-diagnostic
          path: zreflect-report/
          if-no-files-found: error
