name: macOS Vulkan command optimisation 002
run-name: CSE WARP macOS Vulkan commands 002 — ${{ github.run_number }}
on:
  push:
    branches: ['perf/macos-vulkan-commands-002']
    paths: ['.github/workflows/qa-macos-vulkan-commands.yml','.github/workflows/build-macos-vulkan.yml','v16/**','v17/**','engine/**','experiments/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-vulkan-commands-002-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Host and tools
        run: |
          mkdir -p results
          sw_vers | tee results/host.txt
          uname -m | tee -a results/host.txt
          test "$(uname -m)" = arm64
          xcodebuild -version | tee -a results/host.txt
          ninja --version
          xcrun --sdk macosx --show-sdk-version
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Install official Vulkan SDK
        env:
          VERSION: '1.4.363.1'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vulkan-download"
          mkdir -p "$work"
          cd "$work"
          curl --fail --location --retry 2 --max-time 240 "https://sdk.lunarg.com/sdk/download/$VERSION/mac/vulkansdk-macos-$VERSION.zip" -o sdk.zip
          unzip -q sdk.zip
          app="$(find "$work" -maxdepth 3 -name '*.app' -print -quit)"
          test -n "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          "$app/Contents/MacOS/$exe" --root "$RUNNER_TEMP/VulkanSDK" --accept-licenses --default-answer --confirm-command install copy_only=1
          sdk="$RUNNER_TEMP/VulkanSDK/macOS"
          test -d "$sdk/include/vulkan"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          find "$sdk/share/vulkan/icd.d" -maxdepth 1 -type f -print | tee "$GITHUB_WORKSPACE/results/icds.txt"
      - name: Resolve engine version and pinned benchmark scene V17.634
        run: |
          set -euo pipefail
          product="$(python3 -c 'import json; v=json.load(open("v17/version.json"))["engine"]; print("%d.%03d"%(v["major"],v["build"]))')"
          echo "V17_PRODUCT=$product" >> "$GITHUB_ENV"
          # Match the validated Build 4; avoid rate-limited latest-release API.
          cat >> "$GITHUB_ENV" <<'ENV'
          SCENE_TAG=scene-reflect-V17.634
          SCENE_REVISION=V17.634
          SCENE_ZIP_URL=https://github.com/glaby91/moteur3d-scene/releases/download/scene-reflect-V17.634/V17-scene.zip
          SCENE_ZIP_SHA=f975639311e5b5d48ae996ac1f4f986994b232befb29617290f51bdf2bfbb703
          SCENE_MANIFEST_URL=https://github.com/glaby91/moteur3d-scene/releases/download/scene-reflect-V17.634/SCENE_VERSION.json
          SCENE_MANIFEST_SHA=77d501dc6afa54f2a1793d1c26da8c0cd1645c0cc554636b417ecfcdf7ebcb73
          ENV
      - name: Download and verify exact scene release
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SCENE_ZIP_URL" -o "$RUNNER_TEMP/V17-scene.zip"
          curl --fail --location --retry 3 "$SCENE_MANIFEST_URL" -o "$RUNNER_TEMP/SCENE_VERSION.json"
          echo "$SCENE_ZIP_SHA  $RUNNER_TEMP/V17-scene.zip" | shasum -a 256 -c -
          echo "$SCENE_MANIFEST_SHA  $RUNNER_TEMP/SCENE_VERSION.json" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/v17-scene"
          unzip -q "$RUNNER_TEMP/V17-scene.zip" -d "$RUNNER_TEMP/v17-scene"
          cmp "$RUNNER_TEMP/SCENE_VERSION.json" "$RUNNER_TEMP/v17-scene/SCENE_VERSION.json"
          python3 - "$RUNNER_TEMP/v17-scene" "$SCENE_REVISION" "$SCENE_TAG" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "SCENE_VERSION.json").read_text())
          scene = json.loads((root / "benchmark-civic/scene.json").read_text())
          assert manifest["repository"] == "glaby91/moteur3d-scene"
          assert manifest["channel"] == "reflect" and manifest["tag"] == sys.argv[3]
          assert manifest["scene"] == "benchmark-civic/scene.json"
          assert manifest["revision"] == scene["revision"] == sys.argv[2]
          print("Verified bundled scene:", scene["revision"])
          PY
      - name: Configure actual engine
        run: |
          set -euo pipefail
          export PATH="$VULKAN_SDK/bin:$PATH"
          cmake -S v17 -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DM3D_REQUIRE_VULKAN=ON -DV17_CI_BUILD_NUMBER="$GITHUB_RUN_NUMBER" -DV17_GIT_SHA="$GITHUB_SHA" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DV17_SCENE_SOURCE_DIR="$RUNNER_TEMP/v17-scene/benchmark-civic" 2>&1 | tee results/configure.log
      - name: Compile actual engine, tools and original Vulkan shaders
        run: |
          set -euo pipefail
          cmake --build build-macos --parallel 4 --target moteur3d_v17 moteur3d_v17_benchmark moteur3d_v17_campaign moteur3d_v17_gibake v17_vulkan_gpu_smoke v17_vulkan_version_smoke v17_vulkan_mesh_smoke v17_vulkan_dirty_policy_smoke v17_vulkan_mipmap_smoke v17_vulkan_readback_smoke v17_macos_scene_smoke v17_macos_opt_bench 2>&1 | tee results/build.log
          file build-macos/moteur3d_v17 build-macos/v16/libmoteur3d_v16_core.dylib | tee results/binaries.txt
      - name: Actual Vulkan raster and scene tests via MoltenVK (both profiles)
        run: |
          set -euo pipefail
          export VK_DRIVER_FILES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_LIBRARY_PATH="$VULKAN_SDK/lib"
          export QT_QPA_PLATFORM=offscreen CSE_WARP_VK_MSAA=1
          root="$PWD"
          cd build-macos
          python3 - "$root/results" <<'PY'
          import json, os, pathlib, signal, subprocess, sys, time
          out=pathlib.Path(sys.argv[1])
          results=[]
          def run(name,args,env,limit):
              start=time.monotonic()
              print("BEGIN",name,flush=True)
              with (out/(name+".log")).open("w") as log:
                  p=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT,env=env,start_new_session=True)
                  try: code=p.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      try: os.killpg(p.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      p.wait()
                      code=124
              body=(out/(name+".log")).read_text(errors="replace")
              print(body[:35000],flush=True)
              results.append({"case":name,"exit_code":code,"wall_seconds":round(time.monotonic()-start,3)})
              (out/"status.json").write_text(json.dumps(results,indent=2))
              print("END",results[-1],flush=True)
              return code
          env=os.environ.copy()
          run("ctest",["ctest","--output-on-failure","-R","^v17_vulkan_","--no-tests=error"],env,90)
          for name,flag in [("optimized","1"),("baseline","0")]:
              e=env.copy();e["CSE_WARP_VK_FAST_FRAGMENT"]=flag
              png=out/(name+"-triangle.png")
              args=["./v17_vulkan_gpu_smoke",str(png)]
              code=run(name+"-triangle",args,e,90)
              if code==0 and png.is_file() and png.stat().st_size>0:
                  run(name+"-scene",["./v17_macos_scene_smoke","benchmark-civic/scene.json",str(out/name)],e,300)
              else:
                  results.append({"case":name+"-scene","exit_code":None,"reason":"triangle failed or image missing"})
                  (out/"status.json").write_text(json.dumps(results,indent=2))
                  if code==-11:
                      run(name+"-lldb",["xcrun","lldb","--batch","-o","settings set target.disable-aslr false","-o","run","-k","thread backtrace all","--",*args],e,120)
          run("navigation",["./moteur3d_v17","--smoke-walking-collisions","benchmark-civic/scene.json"],env,180)
          PY
          cat "$root/results/status.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Vulkan command campaign (full on explicit request, short otherwise)
        env:
          FULL_CAMPAIGN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-vulkan-campaign]')) }}
        run: |
          set -euo pipefail
          export VK_DRIVER_FILES="$VULKAN_SDK/share/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_LIBRARY_PATH="$VULKAN_SDK/lib"
          export QT_QPA_PLATFORM=offscreen
          root="$PWD"
          cd build-macos
          if [ "$FULL_CAMPAIGN" = true ]; then
            python3 "$root/experiments/macos-metal-vulkan/command_campaign.py" "$root/results/commands"
          else
            python3 "$root/experiments/macos-metal-vulkan/command_stability.py" "$root/results/commands"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macOS-vulkan-command-002-results
          path: results/
          if-no-files-found: error
      - name: Require complete runtime smoke and campaign records
        if: success()
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('results')
          cases={r['case']:r['exit_code'] for r in json.loads((root/'status.json').read_text())}
          assert all(cases.get(k)==0 for k in ('ctest','optimized-triangle','baseline-triangle','optimized-scene','baseline-scene','navigation'))
          result=json.loads((root/'commands'/'summary.json').read_text())
          assert result['complete'], 'Incomplete reference or comparison campaign'
          PY
