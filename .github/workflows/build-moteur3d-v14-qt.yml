name: Moteur3D V16 Pavillon01 Windows
on:
  push:
    branches:
      - feature/v16-modular-scene-dispatch
    paths:
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
      - 'scenes/v16/pavillon01/**'
      - 'tools/v16_scene_dispatch.py'
      - '.github/workflows/build-moteur3d-v14-qt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc-qt6:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Pavillon01 JSON resources
        shell: pwsh
        run: python tools/v16_scene_dispatch.py scenes/v16/pavillon01/scene.json --sector pavillon01
      - name: Configure MSVC
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: cmake -S . -B build-v16 -G "Visual Studio 17 2022" -A x64
      - name: Build V16
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: cmake --build build-v16 --config Release --parallel
      - name: Test Pavillon01 geometry and BVH
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: ctest --test-dir build-v16 --build-config Release --output-on-failure
      - name: Install scene, shader and Qt runtime
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: |
          cmake --install build-v16 --config Release --prefix dist-v16
          if (!(Test-Path dist-v16/moteur3d_qt.exe)) { throw 'Missing executable' }
          if (!(Test-Path dist-v16/scenes/v16/pavillon01/scene.json)) { throw 'Missing scene manifest' }
          if (!(Test-Path dist-v16/shaders/m3d_raytrace_compute.hlsl)) { throw 'Missing shader' }
          windeployqt --release --compiler-runtime --dir dist-v16 dist-v16/moteur3d_qt.exe
      - name: Upload Windows V16 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Moteur3D-V16-Pavillon01-Windows-${{ github.run_number }}
          path: experiments/2026-10-30-cote-ete-gt/native_v14/dist-v16/
          if-no-files-found: error
          retention-days: 30
