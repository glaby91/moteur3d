name: V17 Linux x64 Vulkan
run-name: CSE WARP V17 Linux Vulkan — build ${{ github.run_number }}
on:
  push:
    branches: [master, integration/v17-main-linux-vulkan]
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'engine/**'
      - 'cmake/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
      - '.github/workflows/build-linux-vulkan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-linux-vulkan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Install Vulkan SDK tools and Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslang-tools vulkan-tools mesa-vulkan-drivers libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libpulse0 xvfb xauth libssl3t64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Resolve engine version and reference scene for build
        run: |
          set -euo pipefail
          product="$(python3 -c 'import json; v=json.load(open("v17/version.json"))["engine"]; print("%d.%03d"%(v["major"],v["build"]))')"
          echo "V17_PRODUCT=$product" >> "$GITHUB_ENV"
          base="https://github.com/glaby91/moteur3d-scene/releases/download/scene-reflect-V17.631"
          curl --fail --location --retry 3 "$base/V17-scene.zip" -o "$RUNNER_TEMP/V17-scene.zip"
          echo "b44972105f1af661586e9602899529de9d4fc4e1edd994099b28b6b174f3e45d  $RUNNER_TEMP/V17-scene.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v17-scene"
          unzip -q "$RUNNER_TEMP/V17-scene.zip" -d "$RUNNER_TEMP/v17-scene"
          test -f "$RUNNER_TEMP/v17-scene/benchmark-civic/scene.json"
      - name: Configure actual Vulkan backend
        run: |
          cmake -S v17 -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DM3D_REQUIRE_VULKAN=ON -DV17_CI_BUILD_NUMBER="$GITHUB_RUN_NUMBER" -DV17_GIT_SHA="$GITHUB_SHA" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DV17_SCENE_SOURCE_DIR="$RUNNER_TEMP/v17-scene/benchmark-civic"
      - name: Compile engine, SPIR-V and Vulkan tests
        run: |
          cmake --build build-linux --parallel 4 --target moteur3d_v17 moteur3d_v17_benchmark moteur3d_v17_campaign v17_vulkan_gpu_smoke v17_vulkan_version_smoke v17_vulkan_mesh_smoke v17_vulkan_dirty_policy_smoke v17_vulkan_mipmap_smoke v17_vulkan_readback_smoke
      - name: Check Vulkan CPU tests and actual shader rendering using Mesa lavapipe
        env:
          QT_QPA_PLATFORM: offscreen
          CSE_WARP_VK_ALLOW_SOFTWARE_TEST: '1'
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir build-linux --output-on-failure -R '^v17_vulkan_' --no-tests=error
          vulkaninfo --summary
          cd build-linux
          ./v17_vulkan_gpu_smoke "$GITHUB_WORKSPACE/vulkan-linux-smoke.png"
      - name: Package versioned engine directory (no scene)
        run: |
          set -euo pipefail
          product="$V17_PRODUCT"
          name="CSE-WARP-V${product}-Linux-Vulkan-GitHub-${GITHUB_RUN_NUMBER}-x86_64"
          dst="dist-linux/$name"
          mkdir -p "$dst"
          cp build-linux/moteur3d_v17 build-linux/moteur3d_v17_benchmark build-linux/moteur3d_v17_campaign build-linux/v17_vulkan_gpu_smoke "$dst/"
          cp build-linux/libmoteur3d_v16_core.so "$dst/"
          cp -r build-linux/vulkan build-linux/audio build-linux/shaders "$dst/"
          cp build-linux/render_modules.json "$dst/"
          cp v17/docs/LINUX_VULKAN.md "$dst/README.md"
          # Qt dependencies installed by CI are not assumed to exist on the user PC.
          mkdir -p "$dst/qt/lib" "$dst/qt/plugins"
          cp -a "$QT_ROOT_DIR/lib"/libQt6*.so* "$dst/qt/lib/"
          # Qt's ICU SONAME is independent of the distribution's ICU version.
          # Copy the exact libraries used by this Qt SDK, not the host ABI.
          LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" ldd "$QT_ROOT_DIR/lib/libQt6Core.so.6" | tee qt-sdk-ldd.txt
          for component in i18n uc data; do
            entry="$(awk -v prefix="libicu${component}.so." 'index($1,prefix)==1 && $2=="=>" && $3 ~ /^\// {print $1, $3; exit}' qt-sdk-ldd.txt)"
            test -n "$entry" || { echo "Missing ICU dependency: $component"; exit 1; }
            read -r soname source <<< "$entry"
            test -f "$source"
            cp -L -- "$source" "$dst/qt/lib/$soname"
          done
          cp -a "$QT_ROOT_DIR/plugins"/platforms "$QT_ROOT_DIR/plugins"/imageformats "$QT_ROOT_DIR/plugins"/multimedia "$QT_ROOT_DIR/plugins"/tls "$dst/qt/plugins/"
          # Ship XCB extension libraries required by Qt's xcb plugin, including
          # cursor and its transitive image/render/util helpers. Keep the system
          # X11 core, libc, graphics drivers and OpenSSL security updates on host.
          LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" ldd "$QT_ROOT_DIR/plugins/platforms/libqxcb.so" | tee qt-xcb-sdk-ldd.txt
          awk '$2=="=>" && $3 ~ /^\// && ($1 ~ /^libxcb-.*\.so\./ || $1 ~ /^libxkbcommon-x11\.so\./) {print $1, $3}' qt-xcb-sdk-ldd.txt | sort -u > xcb-runtime.txt
          grep -q '^libxcb-cursor\.so\.0 ' xcb-runtime.txt
          mkdir -p "$dst/licenses"
          while read -r soname source; do
            test -f "$source"
            cp -L -- "$source" "$dst/qt/lib/$soname"
            # Retain distribution copyright and redistribution notices.
            owner="$(dpkg-query -S "$source" 2>/dev/null | head -n 1 | cut -d: -f1 || true)"
            if [ -z "$owner" ]; then
              owner="$(dpkg-query -S "/lib/${source#/usr/lib/}" 2>/dev/null | head -n 1 | cut -d: -f1 || true)"
            fi
            if [ -n "$owner" ] && [ -f "/usr/share/doc/$owner/copyright" ]; then
              cp -L "/usr/share/doc/$owner/copyright" "$dst/licenses/$owner.txt"
            fi
          done < xcb-runtime.txt
          test -f "$dst/qt/lib/libxcb-cursor.so.0"
          test -f "$dst/qt/plugins/tls/libqopensslbackend.so"
          cat > "$dst/lancer.sh" <<'SH'
          #!/usr/bin/env bash
          set -e
          cd -- "$(dirname -- "$0")"
          export LD_LIBRARY_PATH="$PWD:$PWD/qt/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$PWD/qt/plugins"
          exec ./moteur3d_v17 "$@"
          SH
          chmod +x "$dst/lancer.sh"
          printf '{"productVersion":"%s","githubActionsRun":"%s","sourceCommit":"%s","platform":"linux-x86_64","backend":"Vulkan","presentation":"Qt QImage"}\n' "$product" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/BUILD_INFO.json"
          # Validate the distributable in isolation from the Qt SDK environment.
          package="$(realpath "$dst")"
          runtime="$package:$package/qt/lib"
          for binary in moteur3d_v17 moteur3d_v17_benchmark moteur3d_v17_campaign v17_vulkan_gpu_smoke; do
            env -u QT_ROOT_DIR -u QT_PLUGIN_PATH LD_LIBRARY_PATH="$runtime" ldd "$package/$binary"
          done | tee linux-ldd.txt
          ! grep -q 'not found' linux-ldd.txt
          for component in i18n uc data; do
            awk -v prefix="libicu${component}.so." -v dir="$package/qt/lib/" '
              index($1,prefix)==1 && $2=="=>" {seen=1; if (index($3,dir)!=1) bad=1}
              END {exit (!seen || bad)}
            ' linux-ldd.txt
          done
          # Check the dynamically loaded plugins as well as the application.
          for plugin in platforms/libqxcb.so tls/libqopensslbackend.so; do
            env -u QT_ROOT_DIR -u QT_PLUGIN_PATH LD_LIBRARY_PATH="$runtime" ldd "$package/qt/plugins/$plugin"
          done | tee linux-plugins-ldd.txt
          ! grep -q 'not found' linux-plugins-ldd.txt
          while read -r soname source; do
            awk -v lib="$soname" -v dir="$package/qt/lib/" '
              $1==lib && $2=="=>" {seen=1; if (index($3,dir)!=1) bad=1}
              END {exit (!seen || bad)}
            ' linux-plugins-ldd.txt
          done < xcb-runtime.txt
          # Real Qt X11 window and TLS backend initialization from packaged
          # plugins, using a virtual X server. No network request is required.
          probe="$RUNNER_TEMP/qt-package-probe"
          mkdir -p "$probe"
          cat > "$probe/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.24)
          project(QtPackageProbe LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Gui Network)
          add_executable(qt_package_probe probe.cpp)
          target_link_libraries(qt_package_probe PRIVATE Qt6::Gui Qt6::Network)
          set_target_properties(qt_package_probe PROPERTIES SKIP_BUILD_RPATH TRUE)
          CMAKE
          cat > "$probe/probe.cpp" <<'CPP'
          #include <QGuiApplication>
          #include <QWindow>
          #include <QSslSocket>
          #include <QDebug>
          int main(int argc, char **argv) {
              QGuiApplication app(argc, argv);
              QWindow window;
              window.resize(320, 240);
              window.show();
              app.processEvents();
              if (app.platformName() != QStringLiteral("xcb") || !window.isVisible() || !window.winId()) return 1;
              if (!QSslSocket::setActiveBackend(QStringLiteral("openssl")) || !QSslSocket::supportsSsl()) return 2;
              qInfo() << "XCB and TLS PASS" << QSslSocket::sslLibraryVersionString();
              return 0;
          }
          CPP
          cmake -S "$probe" -B "$probe/build" -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$probe/build"
          xvfb-run -a env -u QT_ROOT_DIR -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            LD_LIBRARY_PATH="$runtime" QT_PLUGIN_PATH="$package/qt/plugins" \
            QT_QPA_PLATFORM=xcb "$probe/build/qt_package_probe" 2>&1 | tee linux-xcb-tls-smoke.txt
          # Exercise the packaged binary and bundled libraries, not the build tree.
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd"
          (
            cd "$package"
            env -u QT_ROOT_DIR -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
              LD_LIBRARY_PATH="$runtime" QT_PLUGIN_PATH="$package/qt/plugins" \
              QT_QPA_PLATFORM=offscreen CSE_WARP_VK_ALLOW_SOFTWARE_TEST=1 \
              VK_ICD_FILENAMES="$icd" ./v17_vulkan_gpu_smoke "$GITHUB_WORKSPACE/vulkan-linux-package-smoke.png"
          )
          tar -C dist-linux -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V${{ env.V17_PRODUCT }}-Linux-Vulkan-GitHub-${{ github.run_number }}-x86_64
          path: CSE-WARP-V*-Linux-Vulkan-GitHub-*-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Linux-Vulkan-diagnostics
          path: |
            vulkan-linux-smoke.png
            linux-ldd.txt
            qt-sdk-ldd.txt
            vulkan-linux-package-smoke.png
            qt-xcb-sdk-ldd.txt
            xcb-runtime.txt
            linux-plugins-ldd.txt
            linux-xcb-tls-smoke.txt
