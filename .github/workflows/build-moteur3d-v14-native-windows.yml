name: Build native Moteur 3D — Rev 1 Branch 3

on:
  push:
    branches:
      - experiment/manhattan-silent-hill-2026-10-30
    paths:
      - experiments/2026-10-30-cote-ete-gt/native_v14/moteur3d_v14_native.cpp
      - experiments/2026-10-30-cote-ete-gt/native_v14/export_scene.js
      - experiments/2026-10-30-cote-ete-gt/native_v14/source_v1314.html
      - experiments/2026-10-30-cote-ete-gt/native_v14/version.h
      - experiments/2026-10-30-cote-ete-gt/native_v14/moteur3d_v14_native.rc
      - experiments/2026-10-30-cote-ete-gt/native_v14/README.md
      - .github/workflows/build-moteur3d-v14-native-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Export actual V13.14 scene, BVH and textures
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: node export_scene.js source_v1314.html moteur3d_v1314_scene.bin
      - name: Compile native x64 application and Windows version resource
        shell: cmd
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /utf-8 /DUNICODE /D_UNICODE /c moteur3d_v14_native.cpp
          rc /nologo moteur3d_v14_native.rc
          link /nologo /SUBSYSTEM:WINDOWS moteur3d_v14_native.obj moteur3d_v14_native.res user32.lib gdi32.lib comctl32.lib /OUT:Moteur3D-Natif-x64-Rev1-Branch3-261101-0850.exe
      - name: Package executable with the exported V13.14 scene
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: Compress-Archive -Path Moteur3D-Natif-x64-Rev1-Branch3-261101-0850.exe,moteur3d_v1314_scene.bin -DestinationPath Moteur3D-Natif-x64-Rev1-Branch3-261101-0850.zip -CompressionLevel Optimal
      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: Moteur3D-Natif-x64-Rev1-Branch3-261101-0850
          path: experiments/2026-10-30-cote-ete-gt/native_v14/Moteur3D-Natif-x64-Rev1-Branch3-261101-0850.zip
          if-no-files-found: error
          retention-days: 30
