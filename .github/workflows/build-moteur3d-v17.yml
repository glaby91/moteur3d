          if ($LASTEXITCODE -ne 0) { throw 'Final delivered V17 tree scene failed real DX11 WARP rendering' }
          $pic=Get-ChildItem "build-v17/final-v4-10-tree-smoke" -Recurse -Filter 'raster_v4_face_*.png' | Select-Object -First 1
          if (!$pic -or $pic.Length -lt 1200) { throw 'Final tree scene preview missing or empty' }
