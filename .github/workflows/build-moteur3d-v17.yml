      - name: V17.500 — Restaurer les ancrages du monument dans le paquet standard
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          # The Vulkan-complete workflow already adds these two concealed
          # concrete cores, eight anchor rods and eight visible nuts. Keep the
          # standard Windows package on the same approved scene lineage.
          $scenePath = "dist-v17/benchmark-civic/scene.json"
          $anchorReportPath = "dist-v17/benchmark-civic/V500_MONUMENT_ANCHORS.json"
          $scene = Get-Content $scenePath -Raw | ConvertFrom-Json
          $sector = $scene.sectors[0]
          if (Test-Path $anchorReportPath) {
            $report = Get-Content $anchorReportPath -Raw | ConvertFrom-Json
            if (@($sector.geometry) -notcontains "geometry/monument-v500-anchors.json" -or
                @($sector.instances) -notcontains "instances/monument-v500-anchors.json" -or
                !(Test-Path "dist-v17/benchmark-civic/geometry/monument-v500-anchors.json") -or
                !(Test-Path "dist-v17/benchmark-civic/instances/monument-v500-anchors.json")) {
              throw 'Existing V17.500 anchor report is not backed by scene resources'
            }
            Write-Host 'V17.500 anchors already exist in the approved V17.603 scene; validating in place.'
          } else {
            python tools/v17_500_anchor_monument.py --package dist-v17/benchmark-civic
            if ($LASTEXITCODE -ne 0) { throw 'V17.500 monument anchoring failed in the standard shipping scene' }
            $report = Get-Content $anchorReportPath -Raw | ConvertFrom-Json
          }
          if ($report.revision -ne 'V17.500' -or
              $report.anchorAssemblies -ne 2 -or
              $report.embeddedConcreteCores -ne 2 -or
              $report.embeddedAnchorRods -ne 8 -or
              $report.visibleAnchorNuts -ne 8) {
            throw 'V17.500 monument anchor assembly is incomplete in the standard package'
          }
          & "dist-v17/moteur3d_v17_benchmark.exe" "dist-v17/benchmark-civic/scene.json" `
            "build-v17/v500-standard-package-smoke" --smoke --camera-id v4_face --hour 19 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw 'V17.500 anchored scene failed standard-package DX11 smoke render' }
          Write-Host 'READY: standard package includes the same V17.500 monument anchors as the Vulkan-complete package.'
      - name: V17.523 — Intégrer la coupole corrigée dans la scène livrée
        shell: pwsh
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          M3D_V16_FORCE_WARP: '1'
        run: |
          $expectedSceneRevision = "V17.604"
          $scenePath = "dist-v17/benchmark-civic/scene.json"
          $reportPath = "dist-v17/benchmark-civic/V523_POOL_CUPOLA.json"
          $scene = Get-Content $scenePath -Raw | ConvertFrom-Json
          $sector = $scene.sectors[0]
          if ((Test-Path $reportPath) -and
              (@($sector.geometry) -contains "geometry/v523-pool-cupola.json") -and
              (Test-Path "dist-v17/benchmark-civic/geometry/v523-pool-cupola.json")) {
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.revision -ne 'V17.523' -or $report.addedCupolaMeshes -ne 5 -or $report.addedCupolaInstances -ne 5) {
              throw 'Existing V17.523 cupola report does not match the approved scene.'
            }
            $report.sceneRevision = $expectedSceneRevision
            $report | ConvertTo-Json -Depth 100 | Set-Content $reportPath -Encoding utf8
            $scene.revision = $expectedSceneRevision
            $scene.name = "CSE WARP $expectedSceneRevision — Palais et coupole vitrée de la piscine"
            $scene | ConvertTo-Json -Depth 100 | Set-Content $scenePath -Encoding utf8
            Write-Host 'Corrected V17.523 cupola already exists in the V17.603 scene; validating in place.'
          } else {
            python tools/v17_523_pool_cupola.py --package dist-v17/benchmark-civic --scene-revision $expectedSceneRevision
            if ($LASTEXITCODE -ne 0) { throw 'V17.523 cupola installation failed in shipping scene' }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          }
          if ($report.revision -ne 'V17.523' -or $report.sceneRevision -ne $expectedSceneRevision -or
              $report.removedFlatSkylightInstances -ne 19 -or
              $report.addedCupolaMeshes -ne 5 -or $report.addedCupolaInstances -ne 5 -or
              $report.addedTriangles -lt 3500 -or $report.addedTriangles -gt 6000 -or
              $report.closedGlassGables -ne 2 -or $report.gableRadialMullions -ne 10 -or
              $report.continuousRoofEaves -ne 4 -or $report.opaqueCrownArcDegrees -ne 60 -or
              $report.cupolaDimensionsMeters.length -ne 60 -or
              $report.cupolaDimensionsMeters.span -ne 34 -or
              $report.lightingChanged -or $report.rendererChanged -or @($report.cameras).Count -ne 3) {
            throw 'Corrected pool cupola is incomplete in the V17 Windows shipping scene'
          }
          $scene = Get-Content "dist-v17/benchmark-civic/scene.json" -Raw | ConvertFrom-Json
          if ($scene.revision -ne $expectedSceneRevision -or !$scene.name.Contains('coupole vitrée')) {
            throw 'Final V17 scene metadata does not identify the corrected cupola'
          }
          & "dist-v17/moteur3d_v17_benchmark.exe" "dist-v17/benchmark-civic/scene.json" `
            "build-v17/cupola-shipping-smoke" --smoke --camera-id v523_cupola_exterieure --hour 14 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw 'Final DX11 WARP cupola render failed' }
          $image = Get-ChildItem "build-v17/cupola-shipping-smoke" -Recurse -Filter 'raster_*.png' -File | Select-Object -First 1
          if (!$image -or $image.Length -lt 1000) { throw 'Final cupola DX11 preview is missing' }
          Copy-Item $image.FullName "dist-v17/benchmark-civic/$($expectedSceneRevision)_COUPOLE_FINAL_DX11.png"
          @"
          CSE WARP BetaX $expectedSceneRevision
          Default scene: approved V17.444 palace with BASSEIN sign and corrected glazed pool cupola.
          Cupola: two closed glazed gables, ten radial mullions, continuous four-side stainless roof curb.
          Run LANCER_CSE_WARP.bat to open the scene.
          "@ | Set-Content "dist-v17/README.txt" -Encoding utf8
          Write-Host "READY: $expectedSceneRevision shipping scene contains and renders the corrected pool cupola."
      - name: V17.001 — Final package finishing pass and multi-view render regressions
        shell: pwsh
        timeout-minutes: 25
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          python tools/v17_600_scene_finish.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'V17.001 synthetic geometry continuity test failed' }
          python tools/v17_600_scene_finish.py --package dist-v17 --revision V17.604 --garden-only
          if ($LASTEXITCODE -ne 0) { throw 'V17.604 scene finishing pass or structural validation failed' }
          python tools/v17_600_scene_finish.py --package dist-v17 --revision V17.604 --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'V17.604 final scene resource validation failed' }
          Remove-Item 'dist-v17/DEMARRER_CSE_WARP_10_ARBRES.bat','dist-v17/DEMARRER_V4_SANS_ARBRES.bat' -ErrorAction SilentlyContinue
          @'
          CSE WARP V17.001
          Scene: Palais Energetik, piscine, fresque continue et coupole à trois vantaux.
          Lancer LANCER_CSE_WARP.bat pour ouvrir le moteur.
          Lancer LANCER_BENCHMARK.bat avec le manifeste de scène, un dossier de sortie et les options souhaitées pour lancer le benchmark sans ouvrir l'interface.
          Le moteur V17 conserve son noyau V16 partagé pour les fonctions communes.
          '@ | Set-Content 'dist-v17/README.txt' -Encoding utf8
          @'
          @echo off
          cd /d "%~dp0"
          if "%~1"=="" (
            echo Usage: LANCER_BENCHMARK.bat scene.json output_dir [options]
            echo Example: LANCER_BENCHMARK.bat "benchmark-civic\scene.json" "results\run1" --full-benchmark --all-scenes --include-cpu
            echo The full benchmark runs in this console and does not open the main interface.
            pause
            exit /b 2
          )
          "moteur3d_v17_campaign.exe" %*
          pause
          '@ | Set-Content 'dist-v17/LANCER_BENCHMARK.bat' -Encoding ascii
          & 'dist-v17/moteur3d_v17_benchmark.exe' 'dist-v17/benchmark-civic/scene.json' 'build-v17/final-600-pool' --smoke --camera-id v7_pool_fresco --hour 14 --raster-msaa 1 --cpu-direct-still --cpu-direct-width 640 --cpu-direct-height 360
          if ($LASTEXITCODE -ne 0) { throw 'V17.001 final fresco package raster/CPU render failed' }
          & 'dist-v17/moteur3d_v17_benchmark.exe' 'dist-v17/benchmark-civic/scene.json' 'build-v17/final-600-cupola' --smoke --camera-id v523_cupola_exterieure --hour 14 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw 'V17.001 final cupola package render failed' }
          & 'dist-v17/moteur3d_v17_benchmark.exe' 'dist-v17/benchmark-civic/scene.json' 'build-v17/final-600-plaza' --smoke --camera-id v4_place --hour 19 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw 'V17.001 final plaza package render failed' }
          & 'dist-v17/moteur3d_v17_benchmark.exe' 'dist-v17/benchmark-civic/scene.json' 'build-v17/final-600-garden' --smoke --camera-id v600_garden_view --hour 18 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw 'V17.001 final garden exterior package render failed' }
          foreach ($pair in @(@('build-v17/final-600-pool','pool-fresco'),@('build-v17/final-600-cupola','cupola'),@('build-v17/final-600-plaza','plaza'),@('build-v17/final-600-garden','garden-global'))) {
            $img=Get-ChildItem $pair[0] -Recurse -Filter '*.png' -File | Where-Object { $_.Length -gt 1000 } | Select-Object -First 1
            if (!$img) { throw "V17.001 $($pair[1]) render missing or blank" }
            Copy-Item $img.FullName "dist-v17/benchmark-civic/V17.001-$($pair[1])-WARP.png"
          }
          Write-Host 'READY: final package rendered with DX11 WARP and CPU ray tracing, including the requested garden-side global view.'
      - name: Audit CPU light paths from the pool fresco
        shell: pwsh
        run: |
          python tools/gi_fresco_ray_audit.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Fresco ray audit math self-test failed' }
          python tools/gi_fresco_ray_audit.py --package dist-v17/benchmark-civic --output build-v17/fresco-ray-audit
          if ($LASTEXITCODE -ne 0) { throw 'Fresco-to-water/cupola ray visibility audit failed' }
          foreach ($p in @("build-v17/fresco-ray-audit/fresco-ray-bundle.svg",
                           "build-v17/fresco-ray-audit/fresco-ray-paths.csv",
                           "build-v17/fresco-ray-audit/fresco-ray-report.json")) {
            if (!(Test-Path $p)) { throw "Fresco ray audit output missing: $p" }
          }
      - name: Upload V17 Windows application
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.001-GitHub-${{ github.run_number }}-Windows-x64
          path: dist-v17/
          if-no-files-found: error
      - name: Upload fresco ray audit visualization
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.001-GitHub-${{ github.run_number }}-fresco-ray-audit
          path: build-v17/fresco-ray-audit/
          if-no-files-found: error
      - name: Benchmark GI hors ligne — trois scènes, trois cuissons et sept relectures
        shell: pwsh
        timeout-minutes: 25
        run: |
          $folder = "build-v17/total-simulation/gi-bench"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $data = @()
          foreach ($entry in @(
            @{ name='pavillon'; scene='scenes/v16/pavillon01/scene.json' },
            @{ name='materiaux'; scene='scenes/v16/material-lab/scene.json' },
            @{ name='civique'; scene='scenes/v16/benchmark-civic/scene.json' }
          )) {
            $cache = Join-Path $folder ($entry.name + ".m3dgi")
            $json = Join-Path $folder ($entry.name + ".json")
            & "build-v17/Release/moteur3d_v17_gibake.exe" $entry.scene $cache --smoke --bench $json
            if ($LASTEXITCODE -ne 0) { throw "GI bake failed for $($entry.name)" }
            $row = Get-Content $json -Raw | ConvertFrom-Json
            if ($row.result -ne 'PASS' -or $row.hours -ne 5 -or
                $row.bakeRepetitions -ne 3 -or $row.cacheLoadRepetitions -ne 7) {
              throw "Incomplete GI benchmark for $($entry.name)"
            }
            $data += [pscustomobject]@{
              version = $row.version; scene = $entry.name
              probes = $row.probes; hours = $row.hours; rays = $row.raysPerProbe
              coldBakeMedianMs = $row.bakeColdMedianMs
              diskLoadMedianMs = $row.diskLoadMedianMs
              sampleInterpolatedMedianMs = $row.sampleInterpolatedMedianMs
              sceneBuildMs = $row.sceneBuildMs
            }
          }
          $data | Export-Csv (Join-Path $folder 'gi-benchmark-summary.csv') -NoTypeInformation
          $data | Format-Table -AutoSize | Out-String | Write-Host
      - name: Benchmark GI volume complet — 864 sondes, 25 heures, 3 cuissons
        shell: pwsh
        timeout-minutes: 25
        run: |
          $folder = "build-v17/total-simulation/gi-bench"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $data = @()
          foreach ($entry in @(
            @{ name='pavillon'; scene='scenes/v16/pavillon01/scene.json' },
            @{ name='materiaux'; scene='scenes/v16/material-lab/scene.json' },
            @{ name='civique'; scene='scenes/v16/benchmark-civic/scene.json' }
          )) {
            $cache = Join-Path $folder ($entry.name + "-full.m3dgi")
            $json = Join-Path $folder ($entry.name + "-full.json")
            # PBR load kept at 256px to control runner RAM; GI volume is full.
            & "build-v17/Release/moteur3d_v17_gibake.exe" $entry.scene $cache --smoke --full-gi --bench $json
            if ($LASTEXITCODE -ne 0) { throw "GI full-table bake failed: $($entry.name)" }
            $row = Get-Content $json -Raw | ConvertFrom-Json
            if ($row.result -ne 'PASS' -or $row.probes -ne 864 -or $row.hours -ne 25 -or
                $row.raysPerProbe -ne 16 -or $row.bakeRepetitions -ne 3 -or
                $row.cacheLoadRepetitions -ne 7) {
              throw "Incomplete full GI benchmark: $($entry.name)"
            }
            $data += [pscustomobject]@{
              version = $row.version; scene = $entry.name
              probes = $row.probes; hours = $row.hours; rays = $row.raysPerProbe
              coldBakeMedianMs = $row.bakeColdMedianMs
              diskLoadMedianMs = $row.diskLoadMedianMs
              sampleInterpolatedMedianMs = $row.sampleInterpolatedMedianMs
              sceneBuildMs = $row.sceneBuildMs
            }
          }
          $data | Export-Csv (Join-Path $folder 'gi-benchmark-full.csv') -NoTypeInformation
          $data | Format-Table -AutoSize | Out-String | Write-Host
      - name: Simulation totale V17 — six scènes, Raster, CPU, Compute et parité PNG
        shell: pwsh
        timeout-minutes: 55
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & './v17/tools/total_simulation.ps1' -BinaryDirectory 'build-v17/Release' -OutputDirectory 'build-v17/total-simulation'
          if ($LASTEXITCODE -ne 0) { throw 'Simulation totale V17 a échoué' }
          # Include actual shader output, not AI-generated references.
          $comparison = "build-v17/total-simulation/lighting-ab"
          New-Item -ItemType Directory -Force $comparison | Out-Null
          Copy-Item "build-v17/v17-raster-warp-quick.png" "$comparison/raster-reference.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.indirect.png" "$comparison/raster-indirect.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.indirect-filmic.png" "$comparison/raster-indirect-filmic.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.baked-gi.png" "$comparison/raster-real-baked-gi.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced.png" "$comparison/raster-balanced-color.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced-085.png" "$comparison/raster-balanced-exposure-085.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced-115.png" "$comparison/raster-balanced-exposure-115.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.color-metrics.csv" "$comparison/color-metrics.csv"
          $viewsFolder=Join-Path $comparison 'civic-camera-views'
          New-Item -ItemType Directory -Force $viewsFolder | Out-Null
          Get-ChildItem "build-v17/civic-views" -Recurse -Filter 'raster_*.png' | ForEach-Object {
            Copy-Item $_.FullName $viewsFolder
          }
      - name: Ten progressive native design passes — 55 real WARP camera renders and feedback
        shell: pwsh
        timeout-minutes: 35
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          node v17/tools/palais_ten_passes.cjs --scene scenes/v16/benchmark-civic --binary build-v17/Release/moteur3d_v17_benchmark.exe --output build-v17/total-simulation/palais-10-pass
          if ($LASTEXITCODE -ne 0) { throw 'Ten-pass real native WARP iteration failed' }
          $report = Get-Content build-v17/total-simulation/palais-10-pass/campaign-summary.json -Raw | ConvertFrom-Json
          if ($report.passesRendered -ne 10 -or !$report.baselineRendered) { throw 'Fewer than ten actual passes were rendered' }
          Write-Host "Ten native iterations completed: $($report.passesKept) kept, $($report.passesRolledBack) rolled back"
      - name: Archive des résultats de simulation totale WARP
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.001-GitHub-${{ github.run_number }}-Total-Simulation-WARP
          path: build-v17/total-simulation/
          if-no-files-found: warn
      # The V17-specific scene-switch and D3D11 benchmark smoke checks have
      # already passed before we publish. Keep the complete inherited suite,
      # but do not delay users' access to the fully packaged Windows app.
      - name: Full V16 and V17 regression suite (post-package)
        run: ctest --test-dir build-v17 -C Release --verbose --output-on-failure
