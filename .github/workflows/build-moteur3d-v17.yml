name: CSE WARP V17.build — Windows x64 exploration
run-name: CSE WARP V17.${{ github.run_number }} — Windows x64
on:
  push:
    branches:
      - feature/v17-realtime-architecture-roadmap-261110
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'scenes/v16/benchmark-civic/**'
      - 'assets/materials/pripyat-v17/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/src/**'
      - '.github/workflows/build-moteur3d-v17.yml'
  pull_request:
    paths:
      - 'v17/**'
      - '.github/workflows/build-moteur3d-v17.yml'
  workflow_dispatch:
concurrency:
  group: cse-warp-v17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 — V17.build and V16 regression tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Generate benchmark scenes from reusable Pripyat material library
        shell: pwsh
        run: |
          node --version
          node scenes/v16/benchmark-civic/generate.cjs --all
          node scenes/v16/benchmark-civic/validate.cjs
      - name: Configure
        shell: pwsh
        run: cmake -S v17 -B build-v17 -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DV17_BUILD_NUMBER=${{ github.run_number }}
      - name: Compile
        run: cmake --build build-v17 --config Release --parallel 4
      - name: Verify V17 executable and shared V16 engine
        shell: pwsh
        run: |
          foreach ($p in @("build-v17/Release/moteur3d_v17.exe",
                         "build-v17/Release/moteur3d_v16_core.dll",
                         "build-v17/Release/moteur3d_v17_benchmark.exe",
                         "build-v17/Release/moteur3d_v17_gibake.exe",
                         "build-v17/Release/moteur3d_v17_campaign.exe",
                         "build-v17/Release/moteur3d_v17_benchui.exe",
                         "build-v17/Release/cse_warp_v17.ico",
                         "build-v17/Release/cse_warp_v17_bench.ico",
                         "build-v17/Release/pavillon01/scene.json",
                         "build-v17/Release/benchmark-civic/scene.json",
                         "build-v17/Release/benchmark-civic/scene-lourd.json",
                         "build-v17/Release/benchmark-civic/scene-extreme.json",
                         "build-v17/Release/shaders/m3d_raytrace_compute.hlsl")) {
            if (!(Test-Path $p)) { throw "Missing V17 package file: $p" }
            Write-Host "Verified: $p"
          }
      - name: Verify native V17 taskbar icon and executable version
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($icon in @("build-v17/Release/cse_warp_v17.ico", "build-v17/Release/cse_warp_v17_bench.ico")) {
            if ((Get-Item $icon).Length -lt 4000) { throw "Incomplete Windows ICO: $icon" }
            $handle = [System.Drawing.Icon]::new((Resolve-Path $icon).Path)
            if (!$handle) { throw "Cannot load Windows icon: $icon" }
            $handle.Dispose()
          }
          foreach ($name in @("moteur3d_v17.exe", "moteur3d_v17_benchui.exe", "moteur3d_v17_benchmark.exe")) {
            $exe = (Resolve-Path "build-v17/Release/$name").Path
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            Write-Host "$name — $($version.ProductName) — $($version.FileVersion)"
            if ($version.FileMajorPart -ne 17 -or
                $version.FileMinorPart -ne [int]$env:GITHUB_RUN_NUMBER -or
                $version.FileBuildPart -ne 0 -or $version.FilePrivatePart -ne 0) {
              throw "Invalid V17.3 GitHub build version in $name : $($version.FileVersion)"
            }
          }
      - name: Validate light complex scene in native V17 loader
        shell: pwsh
        run: |
          $log = "build-v17/v344-native-scene-smoke.log"
          New-Item -ItemType Directory -Force (Split-Path $log -Parent) | Out-Null
          # Avoid relying on native stderr piping/PowerShell Tee-Object behavior.
          # Redirect stdout/stderr directly to a file and preserve exit code.
          & "build-v17/Release/v17_benchmark_scene_load_smoke.exe" "scenes/v16/benchmark-civic/scene.json" 20000 1> $log 2>&1
          $rc = $LASTEXITCODE
          Write-Host "V17 native smoke exit code: $rc"
          if (Test-Path $log) {
            Get-Content $log | ForEach-Object { Write-Host "SCENE_DIAGNOSTIC: $_" }
          } else {
            Write-Warning "Native smoke produced no log; using process exit code."
          }
          if ($rc -ne 0) { throw "Complex scene fails in native V17 loader; exit $rc" }
      - name: Verify real 25% primary rays on Pripyat pool 19h CPU and D3D11 Compute
        shell: pwsh
        timeout-minutes: 15
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          & "build-v17/Release/v17_primary_quarter_pripyat_smoke.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/total-simulation/primary-quarter-pripyat"
          if ($LASTEXITCODE -ne 0) { throw "Native primary-ray 25% Pripyat A/B failed" }
          Get-Content "build-v17/total-simulation/primary-quarter-pripyat/primary-ray-ab.csv" | ForEach-Object { Write-Host $_ }
      - name: Render actual new civic scene with V17 D3D11 Raster WARP
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/civic-bench-smoke" --smoke
          if ($LASTEXITCODE -ne 0) { throw "New civic benchmark scene fails D3D11 first-frame render" }
          $picture = Get-ChildItem "build-v17/civic-bench-smoke" -Recurse -Filter raster_*.png | Select-Object -First 1
          if (!$picture -or $picture.Length -lt 1000) { throw "Civic scene raster PNG missing or empty" }
          Copy-Item $picture.FullName "build-v17/civic-actual-preview.png"
          $summary = Get-ChildItem "build-v17/civic-bench-smoke" -Recurse -Filter summary.json | Select-Object -First 1
          if (!$summary) { throw "Civic benchmark summary missing" }
          $result = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          $raster = $result.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" } | Select-Object -First 1
          if (!$raster) { throw "Civic D3D11 Raster measurement missing" }
          Write-Host "Civic GPU: boxes=$($raster.gpuBoxInstances), foliage=$($raster.gpuFoliageInstances), drawCalls=$($raster.gpuDrawCalls), triangles=$($raster.submittedTriangles)"
          if ($raster.gpuBoxInstances -lt 10) { throw "GPU box instancing not exercised by civic JSON" }
          if ($raster.gpuFoliageInstances -lt 1) { throw "GPU foliage LOD not exercised by civic JSON" }
          if ($raster.gpuDrawCalls -lt 1) { throw "No draw calls measured" }
      - name: V17 visual QA — render all 11 palace camera views with actual DX11 WARP
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/civic-views" --smoke --all-cameras
          if ($LASTEXITCODE -ne 0) { throw "Civic 11-camera real WARP preview failed" }
          $pictures = @(Get-ChildItem "build-v17/civic-views" -Recurse -Filter 'raster_*.png')
          if ($pictures.Count -ne 11) {
            throw "Incomplete visual review: expected 11 actual camera PNG, found $($pictures.Count)"
          }
          foreach ($camera in @('facade','mosaique','bassin','hall','vestiaires','passerelle','etage','hall_ensemble','piscine_soir')) {
            $prefix = 'raster_' + $camera + '_'
            $matches = @($pictures | Where-Object { $_.Name.StartsWith($prefix) -and $_.Name.Substring($prefix.Length) -match '^[0-9]+x[0-9]+_depth[0-9]+[.]png$' })
            if ($matches.Count -ne 1 -or $matches[0].Length -lt 1200) {
              throw "Missing/empty scene camera image: $camera"
            }
          }
          $pictures | Sort-Object Name | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }
      - name: V17.324 visual QA — pool at 14h and 19h, same camera
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          foreach ($hour in @(14,19)) {
            & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/pool-hour-$hour" --smoke --camera-id bassin --hour $hour
            if ($LASTEXITCODE -ne 0) { throw "Pool render failed at $hour h" }
            $pic = Get-ChildItem "build-v17/pool-hour-$hour" -Recurse -Filter 'raster_bassin_*.png' | Select-Object -First 1
            if (!$pic -or $pic.Length -lt 1200) { throw "Missing pool PNG at $hour h" }
            Copy-Item $pic.FullName "build-v17/pool-hour-$hour.png"
            Add-Type -AssemblyName System.Drawing
            $bmp = [System.Drawing.Bitmap]::new((Resolve-Path "build-v17/pool-hour-$hour.png").Path)
            $r=0.0; $g=0.0; $b=0.0; $n=0
            for ($y=16; $y -lt $bmp.Height; $y+=32) {
              for ($x=16; $x -lt $bmp.Width; $x+=32) {
                $p=$bmp.GetPixel($x,$y)
                $r+=$p.R; $g+=$p.G; $b+=$p.B; $n++
              }
            }
            $bmp.Dispose()
            $average=($r+$g+$b)/(3*$n)
            Write-Host "Pool $hour h mean RGB = $([math]::Round($r/$n,1)), $([math]::Round($g/$n,1)), $([math]::Round($b/$n,1)); luma=$([math]::Round($average,1))"
            if ($average -lt 8) { throw "Pool entirely too dark at $hour h" }
          }
      - name: V17 visual QA — hall fresco from corrected camera at 19h
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/hall-hour-19" --smoke --camera-id hall --hour 19
          if ($LASTEXITCODE -ne 0) { throw "Hall 19h scene rendering failed" }
          $pic = Get-ChildItem "build-v17/hall-hour-19" -Recurse -Filter 'raster_hall_*.png' | Select-Object -First 1
          if (!$pic -or $pic.Length -lt 1200) { throw "Missing hall 19h PNG" }
          Copy-Item $pic.FullName "build-v17/hall-hour-19.png"
      - name: V17.344 image-quality and GPU comparison — fixed 19h cameras
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          $records = @()
          foreach ($camera in @('bassin','piscine_soir','hall_ensemble')) {
            foreach ($depth in @(1,3)) {
              $folder = "build-v17/v344-$camera-rb$depth"
              & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" $folder --smoke --camera-id $camera --hour 19 --readback-depth $depth
              if ($LASTEXITCODE -ne 0) { throw "V17.344 benchmark failed for $camera depth $depth" }
              $image = Get-ChildItem $folder -Recurse -Filter "raster_$($camera)_*.png" | Select-Object -First 1
              if (!$image -or $image.Length -lt 1200) { throw "Missing $camera PNG" }
              Copy-Item $image.FullName "build-v17/v344-$camera-rb$depth.png"
              $summary = Get-ChildItem $folder -Recurse -Filter summary.json | Select-Object -First 1
              if (!$summary) { throw "Benchmark JSON missing for $camera depth $depth" }
              $measure = Get-Content $summary.FullName -Raw | ConvertFrom-Json
              $row = @($measure.cases | Where-Object { $_.backend -eq 'V17_D3D11_Raster' })[0]
              if (!$row) { throw "Raster measurement missing for $camera depth $depth" }
              $records += [pscustomobject]@{Camera=$camera;Hour=19;ReadbackDepth=$depth;MedianMs=$row.medianMs;Fps=$row.estimatedFps}
            }
          }
          $records | Export-Csv "build-v17/v344-19h-comparison.csv" -NoTypeInformation
          $records | Format-Table | Out-String | Write-Host
      - name: Diagnose raster WARP executable before extended tests
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/v17_raster_warp_smoke.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-raster-warp-quick.png"
          $result = $LASTEXITCODE
          Write-Host "V17 Raster WARP exit code: $result"
          if ($result -ne 0) { throw "V17 raster renderer is not operational; exit $result" }
      - name: V17 GUI scene switching while a previous render may still be active
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path "build-v17/Release/moteur3d_v17.exe").Path
          $args = @("--smoke-scene-switch",
                    "scenes/v16/pavillon01/scene.json",
                    "scenes/v16/material-lab/scene.json")
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          Write-Host "V17 scene-switch smoke exit: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "V17 GUI failed to render after switching scenes (exit $($process.ExitCode))"
          }
      - name: Regression V17 — two GUI renders, identical scene and GPU worker
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path "build-v17/Release/moteur3d_v17.exe").Path
          $args = @("--smoke-repeat-raster", "scenes/v16/pavillon01/scene.json")
          $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          Write-Host "Second-render regression exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            throw "Two successive V17 GPU renders failed ($($p.ExitCode))"
          }
      - name: Benchmark V17 D3D11 Raster on WARP — smoke CSV JSON PNG
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-bench-smoke" --smoke
          if ($LASTEXITCODE -ne 0) { throw "V17 benchmark smoke failed" }
          $summary = Get-ChildItem "build-v17/v17-bench-smoke" -Filter summary.json -Recurse | Select-Object -First 1
          if (!$summary) { throw "Missing benchmark JSON" }
          $json = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if ($json.successful -lt 1) { throw "No successful raster benchmark case" }
          $csv = Join-Path $summary.Directory.FullName "results.csv"
          if (!(Test-Path $csv)) { throw "Missing V17 benchmark CSV" }
          $png = Get-ChildItem (Join-Path $summary.Directory.FullName "images") -Filter *.png | Select-Object -First 1
          if (!$png -or $png.Length -lt 1000) { throw "Missing V17 benchmark PNG" }
      - name: Benchmark DX11 1/2/3 readback buffers with exact image parity
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-bench-readback" --smoke --compare-readback --raster-msaa 2 --raster-anisotropy 8 --raster-lod-percent 85 --raster-culling 1 --raster-lod-enabled 1
          if ($LASTEXITCODE -ne 0) { throw "Pipelined DX11 readback benchmark failed" }
          $summary = Get-ChildItem "build-v17/v17-bench-readback" -Recurse -Filter summary.json | Select-Object -First 1
          if (!$summary) { throw "No pipelined benchmark report" }
          $result = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if ($result.system.rasterQuality.msaaSamples -ne 2 -or
              $result.system.rasterQuality.anisotropy -ne 8 -or
              $result.system.rasterQuality.lodQualityPercent -ne 85) {
            throw "Host-quality flags were not applied in the benchmark process"
          }
          $cases = @($result.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })
          if ($cases.Count -ne 3) { throw "Expected 1, 2 and 3 staging buffer benchmark cases" }
          foreach ($depth in @(1,2,3)) {
            $case = $cases | Where-Object { $_.readbackDepth -eq $depth } | Select-Object -First 1
            if (!$case -or $case.status -ne "ok" -or !$case.pixelIdentical -or
                $case.streamMeanMs -le 0 -or $case.cpuMapWaitMs -lt 0) {
              throw "Depth $depth failed image parity or timing test"
            }
            Write-Host "DX11 depth $depth : throughput $($case.streamFps) FPS, GPU valid=$($case.gpuTimingValid), GPU total=$($case.gpuTotalMs) ms"
          }
      - name: Pixel-exact optimized vs reference PS and GPU readback conversion
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          $exe = "build-v17/Release/moteur3d_v17_benchmark.exe"
          # First run uses the exact previous shader/conversion, the second
          # runs the optimizations. Isolated processes ensure shader recompile.
          foreach ($scene in @("scenes/v16/pavillon01/scene.json", "scenes/v16/benchmark-civic/scene.json")) {
            $name = if ($scene -like "*pavillon01*") { "pavillon" } else { "civic" }
            $env:M3D_V17_DISABLE_SHADER_OPT = '1'
            $env:M3D_V17_DISABLE_FAST_SWIZZLE = '1'
            & $exe $scene "build-v17/shader-ab-$name-reference" --smoke --raster-msaa 2 --raster-anisotropy 8
            if ($LASTEXITCODE -ne 0) { throw "Reference PS failed: $scene" }
            Remove-Item Env:M3D_V17_DISABLE_SHADER_OPT -ErrorAction SilentlyContinue
            Remove-Item Env:M3D_V17_DISABLE_FAST_SWIZZLE -ErrorAction SilentlyContinue
            & $exe $scene "build-v17/shader-ab-$name-optimized" --smoke --raster-msaa 2 --raster-anisotropy 8
            if ($LASTEXITCODE -ne 0) { throw "Optimized PS failed: $scene" }
            $refImg = Get-ChildItem "build-v17/shader-ab-$name-reference" -Recurse -Filter "raster_*.png" | Select-Object -First 1
            $optImg = Get-ChildItem "build-v17/shader-ab-$name-optimized" -Recurse -Filter "raster_*.png" | Select-Object -First 1
            if (!$refImg -or !$optImg) { throw "Missing A/B image for $scene" }
            if ((Get-FileHash $refImg.FullName -Algorithm SHA256).Hash -ne
                (Get-FileHash $optImg.FullName -Algorithm SHA256).Hash) {
              throw "Optimized pixel shader or swizzle changed a pixel: $scene"
            }
            $refSummary=Get-ChildItem "build-v17/shader-ab-$name-reference" -Recurse -Filter "summary.json" | Select-Object -First 1
            $optSummary=Get-ChildItem "build-v17/shader-ab-$name-optimized" -Recurse -Filter "summary.json" | Select-Object -First 1
            $before=Get-Content $refSummary.FullName -Raw | ConvertFrom-Json
            $after=Get-Content $optSummary.FullName -Raw | ConvertFrom-Json
            if ($before.system.pixelShaderOptimized -or $before.system.fastPixelSwizzle -or
                !$after.system.pixelShaderOptimized -or !$after.system.fastPixelSwizzle) {
              throw "A/B shader and conversion mode not correctly reported"
            }
            $referenceCase=@($before.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })[0]
            $optimizedCase=@($after.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })[0]
            if ($referenceCase.status -ne 'ok' -or $optimizedCase.status -ne 'ok' -or
                $referenceCase.submittedTriangles -ne $optimizedCase.submittedTriangles) {
              throw "A/B source geometry or rendering status mismatch: $scene"
            }
            Write-Host "A/B pixel-identical $name — reference mean $($referenceCase.meanMs) ms; optimized mean $($optimizedCase.meanMs) ms (WARP only)"
          }
      - name: Validate bit-identical parallel PBR and mixed-resolution Compute atlas
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/v17_pbr_compute_smoke.exe" "scenes/v16/pavillon01/scene.json"
          if ($LASTEXITCODE -ne 0) {
            throw "PBR parallel pixel equivalence or Compute mip atlas smoke failed"
          }
      - name: Smoke complete multi-round benchmark campaign (all 3 buffer depths)
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_campaign.exe" "scenes/v16/pavillon01/scene.json" "build-v17/campaign-smoke" --smoke --raster-msaa 2 --raster-anisotropy 8 --raster-lod-percent 100
          if ($LASTEXITCODE -ne 0) { throw "Full benchmark campaign smoke failed" }
          $summary=Get-ChildItem "build-v17/campaign-smoke" -Filter summary.json -Recurse | Select-Object -First 1
          if (!$summary) { throw "Campaign summary missing" }
          $s=Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if (!$s.complete -or @($s.cases).Count -ne 3) { throw "Campaign did not cover 1/2/3 buffers" }
          foreach ($case in @($s.cases)) {
            if ($case.status -ne 'ok' -or !$case.pixelIdentical -or
                $case.roundsCompleted -ne 2 -or $case.frames -ne 4 -or
                $case.streamFps -le 0 -or $case.p95Ms -le 0) {
              throw "Campaign repetition or pixel parity failed: depth=$($case.readbackDepth)"
            }
          }
          foreach ($name in @("campaign_frames.csv","campaign_results.csv","campaign_report.html")) {
            if (!(Test-Path (Join-Path $summary.Directory.FullName $name))) {
              throw "Campaign report missing: $name"
            }
          }
          Write-Host "Full campaign smoke: repeated GPU rounds, CSV/JSON/HTML and parity OK"
      - name: Verify V17 D3D11 raster WARP diagnostic preview
        shell: pwsh
        run: |
          $path = "build-v17/v17-raster-warp-quick.png"
          if (!(Test-Path $path)) { throw "Raster V17 PNG missing: $path" }
          if ((Get-Item $path).Length -lt 1000) { throw "Raster V17 preview is blank" }
          Write-Host "Verified V17 Raster WARP PNG"
      - name: Package CSE WARP V17
        shell: pwsh
        run: |
          New-Item -Type Directory -Path "dist-v17" -Force | Out-Null
          Copy-Item "build-v17/Release/moteur3d_v17.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchmark.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_gibake.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_campaign.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchui.exe" "dist-v17/"
          Copy-Item "build-v17/v16/Release/moteur3d_v16.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v16_core.dll" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17.ico" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17_bench.ico" "dist-v17/"
          Copy-Item "build-v17/Release/pavillon01" "dist-v17/pavillon01" -Recurse
          Copy-Item "build-v17/Release/benchmark-civic" "dist-v17/benchmark-civic" -Recurse
          Copy-Item "build-v17/civic-actual-preview.png" "dist-v17/benchmark-civic/actual-render-WARP.png"
          Copy-Item "build-v17/pool-hour-14.png" "dist-v17/benchmark-civic/pool-14h-WARP.png"
          Copy-Item "build-v17/pool-hour-19.png" "dist-v17/benchmark-civic/pool-19h-WARP.png"
