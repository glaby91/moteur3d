          $exe = 'build-v17/Release/moteur3d_v17_benchmark.exe'
          $scene = 'scenes/v16/benchmark-civic/scene-extreme.json'
          # All tests use same scene, camera, 19h, resolution 1366x768.
          # CPU/WARP numbers are NOT Intel GPU hardware benchmarks.
          $cases = @(
            @{stage='flat';msaa=1;lights=171;cull=1;instancing=1},
            @{stage='texture';msaa=1;lights=171;cull=1;instancing=1},
            @{stage='basic';msaa=1;lights=171;cull=1;instancing=1},
            @{stage='full';msaa=1;lights=171;cull=1;instancing=1},
            @{stage='full';msaa=2;lights=171;cull=1;instancing=1},
            @{stage='full';msaa=4;lights=171;cull=1;instancing=1},
            @{stage='full';msaa=8;lights=171;cull=1;instancing=1},
            @{stage='full';msaa=1;lights=0;cull=1;instancing=1},
            @{stage='full';msaa=1;lights=48;cull=1;instancing=1},
            @{stage='full';msaa=1;lights=171;cull=0;instancing=1},
            @{stage='full';msaa=1;lights=171;cull=1;instancing=0},
            @{stage='flat';msaa=1;lights=171;cull=0;instancing=1}
          )
          $rows = @()
          foreach ($case in $cases) {
            if ($case.instancing -eq 0) { $env:M3D_V17_DISABLE_GPU_INSTANCING='1' }
            else { Remove-Item Env:M3D_V17_DISABLE_GPU_INSTANCING -ErrorAction SilentlyContinue }
            $id = "$($case.stage)-msaa$($case.msaa)-light$($case.lights)-cull$($case.cull)-inst$($case.instancing)"
            $folder = "$root/$id"
            & $exe $scene $folder --quick --camera-id facade --hour 19 --profile-stage $case.stage --light-limit $case.lights --raster-msaa $case.msaa --raster-culling $case.cull --readback-depth 1
