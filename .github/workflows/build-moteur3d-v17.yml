          Copy-Item "build-v17/v344-*.png" "dist-v17/benchmark-civic/v344-evening/"
          Copy-Item "build-v17/v344-19h-comparison.csv" "dist-v17/benchmark-civic/v344-evening/"
          New-Item -ItemType Directory -Force "dist-v17/benchmark-civic/render-views-WARP" | Out-Null
