            if (!$render -or $render.status -ne 'ok') { throw "Invalid raster result: $id" }
            $rows += [pscustomobject]@{
              Id=$id;Stage=$case.stage;MSAA=$case.msaa;Lights=$case.lights
              Culling=$case.cull;Instancing=$case.instancing
              GpuDrawMs=$render.gpuDrawMs;GpuTransferMs=$render.gpuTransferMs
              CpuSubmitMs=$render.cpuSubmitMs;CpuMapWaitMs=$render.cpuMapWaitMs
              CpuPixelConvertMs=$render.cpuPixelConvertMs
              StreamFps=$render.streamFps;MedianMs=$render.medianMs
              DrawCalls=$render.gpuDrawCalls;Triangles=$render.submittedTriangles
              GpuTimingValid=$render.gpuTimingValid
            }
            $png = Get-ChildItem $folder -Recurse -Filter 'raster_facade_*.png' | Select-Object -First 1
            if ($png) { Copy-Item $png.FullName "$root/captures/$id.png" }
          }
          Remove-Item Env:M3D_V17_DISABLE_GPU_INSTANCING -ErrorAction SilentlyContinue
