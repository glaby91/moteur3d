name: CSE WARP V17.build — Windows x64 exploration
run-name: CSE WARP V17.${{ github.run_number }} — Windows x64
on:
  push:
    branches:
      - feature/v17-realtime-architecture-roadmap-261110
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'scenes/v16/benchmark-civic/**'
      - 'assets/materials/pripyat-v17/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/src/**'
      - '.github/workflows/build-moteur3d-v17.yml'
  pull_request:
    paths:
      - 'v17/**'
      - '.github/workflows/build-moteur3d-v17.yml'
  workflow_dispatch:
jobs:
  windows:
    name: Windows x64 — V17.build and V16 regression tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Generate benchmark scenes from reusable Pripyat material library
        shell: pwsh
        run: |
          node --version
          node scenes/v16/benchmark-civic/generate.cjs --all
          node scenes/v16/benchmark-civic/validate.cjs
      - name: Configure
        shell: pwsh
        run: cmake -S v17 -B build-v17 -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DV17_BUILD_NUMBER=${{ github.run_number }}
      - name: Compile
        run: cmake --build build-v17 --config Release --parallel 4
      - name: Verify V17 executable and shared V16 engine
        shell: pwsh
        run: |
          foreach ($p in @("build-v17/Release/moteur3d_v17.exe",
                         "build-v17/Release/moteur3d_v16_core.dll",
                         "build-v17/Release/moteur3d_v17_benchmark.exe",
                         "build-v17/Release/moteur3d_v17_benchui.exe",
                         "build-v17/Release/cse_warp_v17.ico",
                         "build-v17/Release/cse_warp_v17_bench.ico",
                         "build-v17/Release/pavillon01/scene.json",
                         "build-v17/Release/benchmark-civic/scene.json",
                         "build-v17/Release/benchmark-civic/scene-lourd.json",
                         "build-v17/Release/benchmark-civic/scene-extreme.json",
                         "build-v17/Release/shaders/m3d_raytrace_compute.hlsl")) {
            if (!(Test-Path $p)) { throw "Missing V17 package file: $p" }
            Write-Host "Verified: $p"
          }
      - name: Verify native V17 taskbar icon and executable version
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($icon in @("build-v17/Release/cse_warp_v17.ico", "build-v17/Release/cse_warp_v17_bench.ico")) {
            if ((Get-Item $icon).Length -lt 4000) { throw "Incomplete Windows ICO: $icon" }
            $handle = [System.Drawing.Icon]::new((Resolve-Path $icon).Path)
            if (!$handle) { throw "Cannot load Windows icon: $icon" }
            $handle.Dispose()
          }
          foreach ($name in @("moteur3d_v17.exe", "moteur3d_v17_benchui.exe", "moteur3d_v17_benchmark.exe")) {
            $exe = (Resolve-Path "build-v17/Release/$name").Path
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            Write-Host "$name — $($version.ProductName) — $($version.FileVersion)"
            if ($version.FileMajorPart -ne 17 -or
                $version.FileMinorPart -ne [int]$env:GITHUB_RUN_NUMBER -or
                $version.FileBuildPart -ne 0 -or $version.FilePrivatePart -ne 0) {
              throw "Invalid V17.3 GitHub build version in $name : $($version.FileVersion)"
            }
          }
      - name: Validate light complex scene in native V17 loader
        shell: pwsh
        run: |
          & "build-v17/Release/v17_benchmark_scene_load_smoke.exe" "scenes/v16/benchmark-civic/scene.json" 20000
          if ($LASTEXITCODE -ne 0) { throw "Complex scene fails in native V17 loader" }
      - name: Render actual new civic scene with V17 D3D11 Raster WARP
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/civic-bench-smoke" --smoke
          if ($LASTEXITCODE -ne 0) { throw "New civic benchmark scene fails D3D11 first-frame render" }
          $picture = Get-ChildItem "build-v17/civic-bench-smoke" -Recurse -Filter raster_*.png | Select-Object -First 1
          if (!$picture -or $picture.Length -lt 1000) { throw "Civic scene raster PNG missing or empty" }
          Copy-Item $picture.FullName "build-v17/civic-actual-preview.png"
      - name: Diagnose raster WARP executable before extended tests
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/v17_raster_warp_smoke.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-raster-warp-quick.png"
          $result = $LASTEXITCODE
          Write-Host "V17 Raster WARP exit code: $result"
          if ($result -ne 0) { throw "V17 raster renderer is not operational; exit $result" }
      - name: V17 GUI scene switching while a previous render may still be active
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path "build-v17/Release/moteur3d_v17.exe").Path
          $args = @("--smoke-scene-switch",
                    "scenes/v16/pavillon01/scene.json",
                    "scenes/v16/material-lab/scene.json")
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          Write-Host "V17 scene-switch smoke exit: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "V17 GUI failed to render after switching scenes (exit $($process.ExitCode))"
          }
      - name: Regression V17 — two GUI renders, identical scene and GPU worker
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path "build-v17/Release/moteur3d_v17.exe").Path
          $args = @("--smoke-repeat-raster", "scenes/v16/pavillon01/scene.json")
          $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          Write-Host "Second-render regression exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            throw "Two successive V17 GPU renders failed ($($p.ExitCode))"
          }
      - name: Benchmark V17 D3D11 Raster on WARP — smoke CSV JSON PNG
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-bench-smoke" --smoke
          if ($LASTEXITCODE -ne 0) { throw "V17 benchmark smoke failed" }
          $summary = Get-ChildItem "build-v17/v17-bench-smoke" -Filter summary.json -Recurse | Select-Object -First 1
          if (!$summary) { throw "Missing benchmark JSON" }
          $json = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if ($json.successful -lt 1) { throw "No successful raster benchmark case" }
          $csv = Join-Path $summary.Directory.FullName "results.csv"
          if (!(Test-Path $csv)) { throw "Missing V17 benchmark CSV" }
          $png = Get-ChildItem (Join-Path $summary.Directory.FullName "images") -Filter *.png | Select-Object -First 1
          if (!$png -or $png.Length -lt 1000) { throw "Missing V17 benchmark PNG" }
      - name: Verify V17 D3D11 raster WARP diagnostic preview
        shell: pwsh
        run: |
          $path = "build-v17/v17-raster-warp-quick.png"
          if (!(Test-Path $path)) { throw "Raster V17 PNG missing: $path" }
          if ((Get-Item $path).Length -lt 1000) { throw "Raster V17 preview is blank" }
          Write-Host "Verified V17 Raster WARP PNG"
      - name: Package CSE WARP V17
        shell: pwsh
        run: |
          New-Item -Type Directory -Path "dist-v17" -Force | Out-Null
          Copy-Item "build-v17/Release/moteur3d_v17.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchmark.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchui.exe" "dist-v17/"
          Copy-Item "build-v17/v16/Release/moteur3d_v16.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v16_core.dll" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17.ico" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17_bench.ico" "dist-v17/"
          Copy-Item "build-v17/Release/pavillon01" "dist-v17/pavillon01" -Recurse
          Copy-Item "build-v17/Release/benchmark-civic" "dist-v17/benchmark-civic" -Recurse
          Copy-Item "build-v17/civic-actual-preview.png" "dist-v17/benchmark-civic/actual-render-WARP.png"
          New-Item -ItemType Directory -Force "dist-v17/material-library/pripyat-v17/originaux" | Out-Null
          Copy-Item "assets/materials/pripyat-v17/catalogue.json" "dist-v17/material-library/pripyat-v17/"
          Copy-Item "assets/materials/pripyat-v17/README.md" "dist-v17/material-library/pripyat-v17/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/prp_concrete_panel.m3dpbr.gz" "dist-v17/material-library/pripyat-v17/originaux/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/prp_concrete_panel_source.jpg" "dist-v17/material-library/pripyat-v17/originaux/"
          # Additional existing Pripyat hero materials/models are preserved as
          # ORIGINAL sources for reuse, not imported into the fictional scene.
          New-Item -ItemType Directory -Force "dist-v17/material-library/pripyat-v17/hero-assets" | Out-Null
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/energetik_fresco_mosaic.jpg" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_fresco_mosaic.glb" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_fresco_mosaic.asset.json" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_facade_bay.glb" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_facade_bay.asset.json" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "build-v17/Release/material-lab" "dist-v17/material-lab" -Recurse
          Copy-Item "build-v17/Release/pripyat-photo2scene-proof" "dist-v17/pripyat-photo2scene-proof" -Recurse
          Copy-Item "build-v17/Release/shaders" "dist-v17/shaders" -Recurse
          git rev-parse HEAD | Out-File "dist-v17/REVISION.txt" -Encoding ascii
          $env:GITHUB_RUN_NUMBER | Out-File "dist-v17/BUILD_NUMBER.txt" -Encoding ascii
          if (!(Test-Path "dist-v17/BUILD_NUMBER.txt")) { throw "Build number missing" }
          windeployqt --release --no-translations dist-v17/moteur3d_v17.exe
          windeployqt --release --no-translations dist-v17/moteur3d_v17_benchui.exe
          windeployqt --release --no-translations dist-v17/moteur3d_v16.exe
      - name: Upload V17 Windows application
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.${{ github.run_number }}-Windows-x64
          path: dist-v17/
          if-no-files-found: error
      # The V17-specific scene-switch and D3D11 benchmark smoke checks have
      # already passed before we publish. Keep the complete inherited suite,
      # but do not delay users' access to the fully packaged Windows app.
      - name: Full V16 and V17 regression suite (post-package)
        run: ctest --test-dir build-v17 -C Release --verbose --output-on-failure
