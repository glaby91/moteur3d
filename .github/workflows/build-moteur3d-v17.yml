name: CSE WARP V17.build — Windows x64 exploration
run-name: CSE WARP V17.${{ github.run_number }} — Windows x64
on:
  push:
    branches:
      - master
      - feature/v17-realtime-architecture-roadmap-261110
      - feature/v17-380-global-architectural-rebuild-261112
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'scenes/v16/benchmark-civic/**'
      - 'assets/materials/pripyat-v17/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/src/**'
      - '.github/workflows/build-moteur3d-v17.yml'
      - 'tools/v493_*'
  pull_request:
    paths:
      - 'v17/**'
      - '.github/workflows/build-moteur3d-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cse-warp-v17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 — V17.build and V16 regression tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Generate benchmark scenes from reusable Pripyat material library
        shell: pwsh
        run: |
          node --version
          node scenes/v16/benchmark-civic/generate.cjs --all
          node scenes/v16/benchmark-civic/validate.cjs
          if ($LASTEXITCODE -ne 0) { throw "V17 scene validation failed" }
          python scenes/v16/benchmark-civic/landscape_v4.py --root scenes/v16/benchmark-civic
          if ($LASTEXITCODE -ne 0) { throw "V4 scene generation failed" }
          foreach ($p in @("scene-v4.json","instances/v4.json","cameras/v4.json","stats/v4-budget.json")) {
            if (!(Test-Path "scenes/v16/benchmark-civic/$p")) { throw "Missing generated V4 resource: $p" }
          }
      - name: Preflight ten design passes without rendering (regression guard)
        shell: pwsh
        run: |
          node v17/tools/palais_ten_passes.cjs --scene scenes/v16/benchmark-civic --binary build-v17/Release/moteur3d_v17_benchmark.exe --check-only
          if ($LASTEXITCODE -ne 0) { throw 'Ten-pass fast design preflight failed' }
      - name: Configure
        shell: pwsh
        run: cmake -S v17 -B build-v17 -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DV17_BUILD_NUMBER=${{ github.run_number }}
      - name: Compile
        run: cmake --build build-v17 --config Release --parallel 4
      - name: Verify V17 executable and shared V16 engine
        shell: pwsh
        run: |
          foreach ($p in @("build-v17/Release/moteur3d_v17.exe",
                         "build-v17/Release/moteur3d_v16_core.dll",
                         "build-v17/Release/moteur3d_v17_benchmark.exe",
                         "build-v17/Release/moteur3d_v17_gibake.exe",
                         "build-v17/Release/moteur3d_v17_campaign.exe",
                         "build-v17/Release/moteur3d_v17_benchui.exe",
                         "build-v17/Release/cse_warp_v17.ico",
                         "build-v17/Release/cse_warp_v17_bench.ico",
                         "build-v17/Release/pavillon01/scene.json",
                         "build-v17/Release/benchmark-civic/scene.json",
                         "build-v17/Release/benchmark-civic/scene-lourd.json",
                         "build-v17/Release/benchmark-civic/scene-extreme.json",
                         "build-v17/Release/shaders/m3d_raytrace_compute.hlsl")) {
            if (!(Test-Path $p)) { throw "Missing V17 package file: $p" }
            Write-Host "Verified: $p"
          }
      - name: Verify native V17 taskbar icon and executable version
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($icon in @("build-v17/Release/cse_warp_v17.ico", "build-v17/Release/cse_warp_v17_bench.ico")) {
            if ((Get-Item $icon).Length -lt 4000) { throw "Incomplete Windows ICO: $icon" }
            $handle = [System.Drawing.Icon]::new((Resolve-Path $icon).Path)
            if (!$handle) { throw "Cannot load Windows icon: $icon" }
            $handle.Dispose()
          }
          foreach ($name in @("moteur3d_v17.exe", "moteur3d_v17_benchui.exe", "moteur3d_v17_benchmark.exe")) {
            $exe = (Resolve-Path "build-v17/Release/$name").Path
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            Write-Host "$name — $($version.ProductName) — $($version.FileVersion)"
            if ($version.FileMajorPart -ne 17 -or
                $version.FileMinorPart -ne [int]$env:GITHUB_RUN_NUMBER -or
                $version.FileBuildPart -ne 0 -or $version.FilePrivatePart -ne 0) {
              throw "Invalid V17.3 GitHub build version in $name : $($version.FileVersion)"
            }
          }
      - name: Validate light complex scene in native V17 loader
        shell: pwsh
        run: |
          $log = "build-v17/v344-native-scene-smoke.log"
          New-Item -ItemType Directory -Force (Split-Path $log -Parent) | Out-Null
          # Avoid relying on native stderr piping/PowerShell Tee-Object behavior.
          # Redirect stdout/stderr directly to a file and preserve exit code.
          & "build-v17/Release/v17_benchmark_scene_load_smoke.exe" "scenes/v16/benchmark-civic/scene.json" 20000 1> $log 2>&1
          $rc = $LASTEXITCODE
          Write-Host "V17 native smoke exit code: $rc"
          if (Test-Path $log) {
            Get-Content $log | ForEach-Object { Write-Host "SCENE_DIAGNOSTIC: $_" }
          } else {
            Write-Warning "Native smoke produced no log; using process exit code."
          }
          if ($rc -ne 0) { throw "Complex scene fails in native V17 loader; exit $rc" }
      - name: Verify real 25% primary rays on Pripyat pool 19h CPU and D3D11 Compute
        shell: pwsh
        timeout-minutes: 15
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          & "build-v17/Release/v17_primary_quarter_pripyat_smoke.exe" "scenes/v16/benchmark-civic/scene.json" "build-v17/total-simulation/primary-quarter-pripyat"
          if ($LASTEXITCODE -ne 0) { throw "Native primary-ray 25% Pripyat A/B failed" }
          Get-Content "build-v17/total-simulation/primary-quarter-pripyat/primary-ray-ab.csv" | ForEach-Object { Write-Host $_ }
      - name: V17 GUI scene switching while a previous render may still be active
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path "build-v17/Release/moteur3d_v17.exe").Path
          $args = @("--smoke-scene-switch",
                    "scenes/v16/pavillon01/scene.json",
                    "scenes/v16/material-lab/scene.json")
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          Write-Host "V17 scene-switch smoke exit: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "V17 GUI failed to render after switching scenes (exit $($process.ExitCode))"
          }
      - name: Benchmark DX11 1/2/3 readback buffers with exact image parity
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/moteur3d_v17_benchmark.exe" "scenes/v16/pavillon01/scene.json" "build-v17/v17-bench-readback" --smoke --compare-readback --raster-msaa 2 --raster-anisotropy 8 --raster-lod-percent 85 --raster-culling 1 --raster-lod-enabled 1
          if ($LASTEXITCODE -ne 0) { throw "Pipelined DX11 readback benchmark failed" }
          $summary = Get-ChildItem "build-v17/v17-bench-readback" -Recurse -Filter summary.json | Select-Object -First 1
          if (!$summary) { throw "No pipelined benchmark report" }
          $result = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if ($result.system.rasterQuality.msaaSamples -ne 2 -or
              $result.system.rasterQuality.anisotropy -ne 8 -or
              $result.system.rasterQuality.lodQualityPercent -ne 85) {
            throw "Host-quality flags were not applied in the benchmark process"
          }
          $cases = @($result.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })
          if ($cases.Count -ne 3) { throw "Expected 1, 2 and 3 staging buffer benchmark cases" }
          foreach ($depth in @(1,2,3)) {
            $case = $cases | Where-Object { $_.readbackDepth -eq $depth } | Select-Object -First 1
            if (!$case -or $case.status -ne "ok" -or !$case.pixelIdentical -or
                $case.streamMeanMs -le 0 -or $case.cpuMapWaitMs -lt 0) {
              throw "Depth $depth failed image parity or timing test"
            }
            Write-Host "DX11 depth $depth : throughput $($case.streamFps) FPS, GPU valid=$($case.gpuTimingValid), GPU total=$($case.gpuTotalMs) ms"
          }
      - name: Pixel-exact optimized vs reference PS and GPU readback conversion
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          $exe = "build-v17/Release/moteur3d_v17_benchmark.exe"
          # First run uses the exact previous shader/conversion, the second
          # runs the optimizations. Isolated processes ensure shader recompile.
          foreach ($scene in @("scenes/v16/benchmark-civic/scene.json")) {
            $name = if ($scene -like "*pavillon01*") { "pavillon" } else { "civic" }
            $env:M3D_V17_DISABLE_SHADER_OPT = '1'
            $env:M3D_V17_DISABLE_FAST_SWIZZLE = '1'
            & $exe $scene "build-v17/shader-ab-$name-reference" --smoke --raster-msaa 2 --raster-anisotropy 8
            if ($LASTEXITCODE -ne 0) { throw "Reference PS failed: $scene" }
            Remove-Item Env:M3D_V17_DISABLE_SHADER_OPT -ErrorAction SilentlyContinue
            Remove-Item Env:M3D_V17_DISABLE_FAST_SWIZZLE -ErrorAction SilentlyContinue
            & $exe $scene "build-v17/shader-ab-$name-optimized" --smoke --raster-msaa 2 --raster-anisotropy 8
            if ($LASTEXITCODE -ne 0) { throw "Optimized PS failed: $scene" }
            $refImg = Get-ChildItem "build-v17/shader-ab-$name-reference" -Recurse -Filter "raster_*.png" | Select-Object -First 1
            $optImg = Get-ChildItem "build-v17/shader-ab-$name-optimized" -Recurse -Filter "raster_*.png" | Select-Object -First 1
            if (!$refImg -or !$optImg) { throw "Missing A/B image for $scene" }
            if ((Get-FileHash $refImg.FullName -Algorithm SHA256).Hash -ne
                (Get-FileHash $optImg.FullName -Algorithm SHA256).Hash) {
              throw "Optimized pixel shader or swizzle changed a pixel: $scene"
            }
            $refSummary=Get-ChildItem "build-v17/shader-ab-$name-reference" -Recurse -Filter "summary.json" | Select-Object -First 1
            $optSummary=Get-ChildItem "build-v17/shader-ab-$name-optimized" -Recurse -Filter "summary.json" | Select-Object -First 1
            $before=Get-Content $refSummary.FullName -Raw | ConvertFrom-Json
            $after=Get-Content $optSummary.FullName -Raw | ConvertFrom-Json
            if ($before.system.pixelShaderOptimized -or $before.system.fastPixelSwizzle -or
                !$after.system.pixelShaderOptimized -or !$after.system.fastPixelSwizzle) {
              throw "A/B shader and conversion mode not correctly reported"
            }
            $referenceCase=@($before.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })[0]
            $optimizedCase=@($after.cases | Where-Object { $_.backend -eq "V17_D3D11_Raster" })[0]
            if ($referenceCase.status -ne 'ok' -or $optimizedCase.status -ne 'ok' -or
                $referenceCase.submittedTriangles -ne $optimizedCase.submittedTriangles) {
              throw "A/B source geometry or rendering status mismatch: $scene"
            }
            Write-Host "A/B pixel-identical $name — reference mean $($referenceCase.meanMs) ms; optimized mean $($optimizedCase.meanMs) ms (WARP only)"
          }
      - name: Validate bit-identical parallel PBR and mixed-resolution Compute atlas
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          & "build-v17/Release/v17_pbr_compute_smoke.exe" "scenes/v16/pavillon01/scene.json"
          if ($LASTEXITCODE -ne 0) {
            throw "PBR parallel pixel equivalence or Compute mip atlas smoke failed"
          }
      - name: Package CSE WARP V17
        shell: pwsh
        run: |
          New-Item -Type Directory -Path "dist-v17" -Force | Out-Null
          Copy-Item "build-v17/Release/moteur3d_v17.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchmark.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_gibake.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_campaign.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v17_benchui.exe" "dist-v17/"
          Copy-Item "build-v17/v16/Release/moteur3d_v16.exe" "dist-v17/"
          Copy-Item "build-v17/Release/moteur3d_v16_core.dll" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17.ico" "dist-v17/"
          Copy-Item "build-v17/Release/cse_warp_v17_bench.ico" "dist-v17/"
          Copy-Item "build-v17/Release/pavillon01" "dist-v17/pavillon01" -Recurse
          Copy-Item "build-v17/Release/benchmark-civic" "dist-v17/benchmark-civic" -Recurse
          # Release CMake distribution includes the legacy benchmark scene only.
          # Overlay the actual generated V4 scene, its instance/camera manifests,
          # referenced textures and all PBR resources in the same relative paths.
          Copy-Item "scenes/v16/benchmark-civic/*" "dist-v17/benchmark-civic/" -Recurse -Force -ErrorAction Stop
          New-Item -ItemType Directory -Force "dist-v17/material-library/pripyat-v17/originaux" | Out-Null
          Copy-Item "assets/materials/pripyat-v17/catalogue.json" "dist-v17/material-library/pripyat-v17/"
          Copy-Item "assets/materials/pripyat-v17/README.md" "dist-v17/material-library/pripyat-v17/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/prp_concrete_panel.m3dpbr.gz" "dist-v17/material-library/pripyat-v17/originaux/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/prp_concrete_panel_source.jpg" "dist-v17/material-library/pripyat-v17/originaux/"
          # Additional existing Pripyat hero materials/models are preserved as
          # ORIGINAL sources for reuse, not imported into the fictional scene.
          New-Item -ItemType Directory -Force "dist-v17/material-library/pripyat-v17/hero-assets" | Out-Null
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/textures/energetik_fresco_mosaic.jpg" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_fresco_mosaic.glb" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_fresco_mosaic.asset.json" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_facade_bay.glb" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "experiments/2026-10-30-cote-ete-gt/native_v14/assets/pripyat/energetik_facade_bay.asset.json" "dist-v17/material-library/pripyat-v17/hero-assets/"
          Copy-Item "build-v17/Release/material-lab" "dist-v17/material-lab" -Recurse
          Copy-Item "build-v17/Release/pripyat-photo2scene-proof" "dist-v17/pripyat-photo2scene-proof" -Recurse
          Copy-Item "build-v17/Release/shaders" "dist-v17/shaders" -Recurse
          git rev-parse HEAD | Out-File "dist-v17/REVISION.txt" -Encoding ascii
          $env:GITHUB_RUN_NUMBER | Out-File "dist-v17/BUILD_NUMBER.txt" -Encoding ascii
          if (!(Test-Path "dist-v17/BUILD_NUMBER.txt")) { throw "Build number missing" }
          # Production starts with experimental Z-prepass disabled. 
          # Z-prepass remains an opt-in internal test; do not ship a launcher.
          @'
          @echo off
          cd /d "%~dp0"
          set "M3D_V17_EXPERIMENT_Z_PREPASS="
          start "" "moteur3d_v17.exe" "benchmark-civic\scene-v4.json"
          '@ | Out-File "dist-v17/START_V4_REFERENCE.bat" -Encoding ascii
          @'
          CSE WARP V17 — Palais reconstruit V4
          Normal launch uses stable rendering (experimental Z-prepass disabled).
          Launch START_V4_REFERENCE.bat for the reference V4 scene.
          Experimental Z-prepass is reserved for developer-only tests.
          The executable defaults to benchmark-civic/scene-v4.json when no CLI path is provided.
          WARP software timings do not represent Intel HD 620 GPU performance.
          '@ | Out-File "dist-v17/README-V4.txt" -Encoding utf8
          $root="dist-v17/benchmark-civic"
          $scene=Get-Content "$root/scene-v4.json" -Raw | ConvertFrom-Json
          $sector=$scene.sectors[0]
          foreach ($kind in @("geometry","materials","pbr","instances","cameras","lighting","environment")) {
            $names=@($sector.$kind)
            if ($names.Count -eq 0) { throw "V4 scene manifest missing $kind" }
            foreach ($name in $names) {
              if (!(Test-Path (Join-Path $root $name))) { throw "V4 resource missing: $kind / $name" }
            }
          }
          foreach ($p in @("scene-v4.json","instances/v4.json","cameras/v4.json","textures/energetik_fresco_mosaic.jpg","textures/personnage_facade_mosaique.jpg")) {
            if (!(Test-Path "$root/$p")) { throw "Required V4 artifact missing: $p" }
          }
          windeployqt --release --no-translations dist-v17/moteur3d_v17.exe
          windeployqt --release --no-translations dist-v17/moteur3d_v17_benchui.exe
          windeployqt --release --no-translations dist-v17/moteur3d_v16.exe
      - name: Import 10 CC0 GLB trees into full Windows V17 package and smoke test final launch scene
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
          M3D_V17_EXPERIMENT_Z_PREPASS: '0'
        run: |
          python -m pip install --disable-pip-version-check trimesh numpy
          if ($LASTEXITCODE -ne 0) { throw 'Missing tree import dependencies' }
          python scenes/v16/benchmark-civic/import_trees_pilot.py --root scenes/v16/benchmark-civic
          if ($LASTEXITCODE -ne 0) { throw '10 CC0 GLB trees import failed' }
          python tools/package_v17_trees.py --dist dist-v17 --source scenes/v16/benchmark-civic
          if ($LASTEXITCODE -ne 0) { throw 'Full distribution assembly failed' }
          & "dist-v17/moteur3d_v17_benchmark.exe" "dist-v17/benchmark-civic/scene-v4.json" "build-v17/final-v4-10-tree-smoke" --smoke --camera-id v4_face --hour 14 --raster-msaa 1 --readback-depth 1
          if ($LASTEXITCODE -ne 0) { throw 'Final delivered V17 tree scene failed real DX11 WARP rendering' }
          $pic=Get-ChildItem "build-v17/final-v4-10-tree-smoke" -Recurse -Filter 'raster_v4_face_*.png' | Select-Object -First 1
          if (!$pic -or $pic.Length -lt 1200) { throw 'Final tree scene preview missing or empty' }
          Copy-Item $pic.FullName "dist-v17/benchmark-civic/10-arbres-V17-WARP.png"
          Write-Host "READY: V17 Windows package opens corrected V4 + 10 trees by default"
      - name: Restore approved V17.444 scene (186 materials) and radio — verify shipped package
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          # The previous V17.484 package silently shipped the synthetic generated
          # scene instead of the user's approved 186-material V17.444 scene.
          # Recover the exact immutable approved artifact before publishing.
          gh run download 43512499128 --repo glaby91/moteur3d --name CSE-WARP-V17.444-EXPERIMENTAL-Windows-x64-Scene-V443 --dir approved-v444
          if ($LASTEXITCODE -ne 0) { throw "Approved V17.444 scene artifact download failed" }
          $approved = "approved-v444/benchmark-civic"
          $manifest = Get-Content "$approved/scene.json" -Raw | ConvertFrom-Json
          if (@($manifest.sectors).Count -ne 1) { throw "Approved scene must contain one complete sector" }
          $sector = $manifest.sectors[0]
          if (@($sector.materials).Count -ne 1 -or @($sector.pbr).Count -ne 1) {
            throw "Approved scene has missing material/PBR manifest"
          }
          $materials = Get-Content (Join-Path $approved $sector.materials[0]) -Raw | ConvertFrom-Json
          $pbr = Get-Content (Join-Path $approved $sector.pbr[0]) -Raw | ConvertFrom-Json
          if (@($materials.materials).Count -ne 186 -or @($pbr.sets).Count -ne 183) {
            throw "Wrong scene: expected exactly 186 materials and 183 PBR sets"
          }
          foreach ($kind in @("geometry","instances","materials","pbr","lighting","cameras","environment")) {
            foreach ($relative in @($sector.$kind)) {
              if (!(Test-Path (Join-Path $approved $relative))) {
                throw "Approved V17.444 resource missing: $kind / $relative"
              }
            }
          }
          $imageCount = 0
          foreach ($set in $pbr.sets) {
            if ($set.imageFile) {
              if (!(Test-Path (Join-Path $approved $set.imageFile))) {
                throw "Approved V17.444 PBR image missing: $($set.imageFile)"
              }
              $imageCount++
            }
          }
          if ($imageCount -ne 82) { throw "Approved scene should reference 82 intact PBR image assets" }
          if (!(Test-Path "approved-v444/audio/pripyat_radio.wav")) {
            throw "Approved Ukrainian radio WAV missing"
          }
          Remove-Item "dist-v17/benchmark-civic" -Recurse -Force -ErrorAction Stop
          Copy-Item $approved "dist-v17/benchmark-civic" -Recurse -Force
          if (Test-Path "dist-v17/audio") { Remove-Item "dist-v17/audio" -Recurse -Force }
          Copy-Item "approved-v444/audio" "dist-v17/audio" -Recurse -Force
          Remove-Item "dist-v17/START_V4_REFERENCE.bat" -ErrorAction SilentlyContinue
          Remove-Item "dist-v17/README-V4.txt" -ErrorAction SilentlyContinue
          @'
          @echo off
          cd /d "%~dp0"
          start "" "moteur3d_v17.exe" "benchmark-civic\scene.json"
          '@ | Set-Content "dist-v17/LANCER_CSE_WARP.bat" -Encoding ascii
          @'
          CSE WARP BetaX — V17 package
          Default validated scene: V17.444, 186 materials, 183 PBR sets, 82 original image textures.
          Run LANCER_CSE_WARP.bat or moteur3d_v17.exe to open the approved scene.
          Ukrainian radio and reference artworks are packaged with the scene.
          '@ | Set-Content "dist-v17/README.txt" -Encoding utf8
          # Smoke-test the exact scene we are going to deliver, not a substitute.
          & "dist-v17/moteur3d_v17_benchmark.exe" "dist-v17/benchmark-civic/scene.json" "build-v17/approved-v444-shipping-smoke" --smoke --camera-id v4_face --hour 14 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw "Approved 186-material scene failed final DirectX11 WARP render" }
          $dayImage=Get-ChildItem "build-v17/approved-v444-shipping-smoke" -Filter 'raster_*.png' -Recurse | Select-Object -First 1
          if (!$dayImage -or $dayImage.Length -lt 1000) { throw "Missing approved-scene DX11 preview PNG" }
          Write-Host "READY: approved 186-material scene, 82 PBR artworks, radio and one validated DX11 render"
      - name: V17.493 - Enregistrer la nouvelle enseigne BASSEIN dans le paquet final
        shell: pwsh
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          M3D_V16_FORCE_WARP: '1'
        run: |
          # The final approved 186-material scene was restored in the preceding step.
          # Integrate the already-tested rooftop sign here, AFTER final scene overlay.
          python -m pip install --disable-pip-version-check numpy pillow trimesh shapely opencv-python-headless matplotlib
          if ($LASTEXITCODE -ne 0) { throw "BASSEIN geometry dependencies failed" }
          $font=python -c "from matplotlib import get_data_path; import os; print(os.path.join(get_data_path(),'fonts','ttf','DejaVuSans-Bold.ttf'))"
          $env:CSE_WARP_FONT=($font | Select-Object -Last 1).Trim()
          if (!(Test-Path $env:CSE_WARP_FONT)) { throw "BASSEIN font missing" }
          python tools/v493_build_bassein_glb.py --out build-v17/sign-bassein-v493.glb
          if ($LASTEXITCODE -ne 0) { throw "BASSEIN GLB generation failed" }
          python tools/v493_replace_roof_sign.py --package dist-v17 --glb build-v17/sign-bassein-v493.glb --allow-unversioned
          if ($LASTEXITCODE -ne 0) { throw "BASSEIN integration failed" }
          $report = Get-Content "dist-v17/benchmark-civic/V493_BASSEIN_SIGN_INSTALL.json" -Raw | ConvertFrom-Json
          if ($report.addedSignObjects -ne 112 -or $report.addedTriangles -lt 14000 -or
              $report.removedSignObjects -lt 50 -or $report.originalUnchangedObjects -lt 5000) {
            throw "BASSEIN visual scene integrity regression"
          }
          & "dist-v17/moteur3d_v17_benchmark.exe" "dist-v17/benchmark-civic/scene.json" "build-v17/bassein-shipping-smoke" --smoke --camera-id v4_face --hour 19 --raster-msaa 1
          if ($LASTEXITCODE -ne 0) { throw "BASSEIN final DX11 WARP smoke failed" }
          $image = Get-ChildItem "build-v17/bassein-shipping-smoke" -Recurse -Filter 'raster_*.png' -File | Select-Object -First 1
          if (!$image -or $image.Length -lt 1000) { throw "BASSEIN final DX11 preview missing" }
          Copy-Item $image.FullName "dist-v17/benchmark-civic/V493_BASSEIN_FINAL_DX11.png"
          Write-Host "READY: CSE WARP V17 build, 186-material reference scene + approved BASSEIN sign."
      - name: Upload V17 Windows application
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.${{ github.run_number }}-Windows-x64
          path: dist-v17/
          if-no-files-found: error
      - name: Benchmark GI hors ligne — trois scènes, trois cuissons et sept relectures
        shell: pwsh
        timeout-minutes: 25
        run: |
          $folder = "build-v17/total-simulation/gi-bench"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $data = @()
          foreach ($entry in @(
            @{ name='pavillon'; scene='scenes/v16/pavillon01/scene.json' },
            @{ name='materiaux'; scene='scenes/v16/material-lab/scene.json' },
            @{ name='civique'; scene='scenes/v16/benchmark-civic/scene.json' }
          )) {
            $cache = Join-Path $folder ($entry.name + ".m3dgi")
            $json = Join-Path $folder ($entry.name + ".json")
            & "build-v17/Release/moteur3d_v17_gibake.exe" $entry.scene $cache --smoke --bench $json
            if ($LASTEXITCODE -ne 0) { throw "GI bake failed for $($entry.name)" }
            $row = Get-Content $json -Raw | ConvertFrom-Json
            if ($row.result -ne 'PASS' -or $row.hours -ne 5 -or
                $row.bakeRepetitions -ne 3 -or $row.cacheLoadRepetitions -ne 7) {
              throw "Incomplete GI benchmark for $($entry.name)"
            }
            $data += [pscustomobject]@{
              version = $row.version; scene = $entry.name
              probes = $row.probes; hours = $row.hours; rays = $row.raysPerProbe
              coldBakeMedianMs = $row.bakeColdMedianMs
              diskLoadMedianMs = $row.diskLoadMedianMs
              sampleInterpolatedMedianMs = $row.sampleInterpolatedMedianMs
              sceneBuildMs = $row.sceneBuildMs
            }
          }
          $data | Export-Csv (Join-Path $folder 'gi-benchmark-summary.csv') -NoTypeInformation
          $data | Format-Table -AutoSize | Out-String | Write-Host
      - name: Benchmark GI volume complet — 864 sondes, 25 heures, 3 cuissons
        shell: pwsh
        timeout-minutes: 25
        run: |
          $folder = "build-v17/total-simulation/gi-bench"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $data = @()
          foreach ($entry in @(
            @{ name='pavillon'; scene='scenes/v16/pavillon01/scene.json' },
            @{ name='materiaux'; scene='scenes/v16/material-lab/scene.json' },
            @{ name='civique'; scene='scenes/v16/benchmark-civic/scene.json' }
          )) {
            $cache = Join-Path $folder ($entry.name + "-full.m3dgi")
            $json = Join-Path $folder ($entry.name + "-full.json")
            # PBR load kept at 256px to control runner RAM; GI volume is full.
            & "build-v17/Release/moteur3d_v17_gibake.exe" $entry.scene $cache --smoke --full-gi --bench $json
            if ($LASTEXITCODE -ne 0) { throw "GI full-table bake failed: $($entry.name)" }
            $row = Get-Content $json -Raw | ConvertFrom-Json
            if ($row.result -ne 'PASS' -or $row.probes -ne 864 -or $row.hours -ne 25 -or
                $row.raysPerProbe -ne 16 -or $row.bakeRepetitions -ne 3 -or
                $row.cacheLoadRepetitions -ne 7) {
              throw "Incomplete full GI benchmark: $($entry.name)"
            }
            $data += [pscustomobject]@{
              version = $row.version; scene = $entry.name
              probes = $row.probes; hours = $row.hours; rays = $row.raysPerProbe
              coldBakeMedianMs = $row.bakeColdMedianMs
              diskLoadMedianMs = $row.diskLoadMedianMs
              sampleInterpolatedMedianMs = $row.sampleInterpolatedMedianMs
              sceneBuildMs = $row.sceneBuildMs
            }
          }
          $data | Export-Csv (Join-Path $folder 'gi-benchmark-full.csv') -NoTypeInformation
          $data | Format-Table -AutoSize | Out-String | Write-Host
      - name: Full V16 and V17 regression suite (post-package)
        run: ctest --test-dir build-v17 -C Release --verbose --output-on-failure
