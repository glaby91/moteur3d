      - name: V17.371 EXPERIMENT — pixel-shader cost, overdraw proxy, PBR and MSAA
        shell: pwsh
        timeout-minutes: 35
        env:
          M3D_V16_FORCE_WARP: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'build-v17/prototype-v371'
