      - name: Benchmark GI hors ligne — trois scènes, trois cuissons et sept relectures
        shell: pwsh
        timeout-minutes: 25
        run: |
          $folder = "build-v17/total-simulation/gi-bench"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $data = @()
          foreach ($entry in @(
            @{ name='pavillon'; scene='scenes/v16/pavillon01/scene.json' },
            @{ name='materiaux'; scene='scenes/v16/material-lab/scene.json' },
            @{ name='civique'; scene='scenes/v16/benchmark-civic/scene.json' }
          )) {
            $cache = Join-Path $folder ($entry.name + ".m3dgi")
            $json = Join-Path $folder ($entry.name + ".json")
            & "build-v17/Release/moteur3d_v17_gibake.exe" $entry.scene $cache --smoke --bench $json
            if ($LASTEXITCODE -ne 0) { throw "GI bake failed for $($entry.name)" }
            $row = Get-Content $json -Raw | ConvertFrom-Json
            if ($row.result -ne 'PASS' -or $row.hours -ne 5 -or
                $row.bakeRepetitions -ne 3 -or $row.cacheLoadRepetitions -ne 7) {
              throw "Incomplete GI benchmark for $($entry.name)"
            }
            $data += [pscustomobject]@{
              version = $row.version; scene = $entry.name
              probes = $row.probes; hours = $row.hours; rays = $row.raysPerProbe
              coldBakeMedianMs = $row.bakeColdMedianMs
              diskLoadMedianMs = $row.diskLoadMedianMs
              sampleInterpolatedMedianMs = $row.sampleInterpolatedMedianMs
              sceneBuildMs = $row.sceneBuildMs
            }
          }
          $data | Export-Csv (Join-Path $folder 'gi-benchmark-summary.csv') -NoTypeInformation
          $data | Format-Table -AutoSize | Out-String | Write-Host
