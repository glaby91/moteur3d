          Write-Host "READY: V17 Windows package opens corrected V4 + 10 trees by default"
      - name: Restore approved V17.603 scene delta and verify corrected source package
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always start from the frozen V17.600 package and apply the exact, reviewed
          # V17.603 scene delta. Never restore the superseded V17.444 scene.
          gh run download 44647231652 --repo glaby91/moteur3d --name CSE-WARP-V17.600-Windows-x64 --dir approved-v600
          if ($LASTEXITCODE -ne 0) { throw "Approved V17.600 base package download failed" }
          $approved = "approved-v600/benchmark-civic"
          if (!(Test-Path "$approved/scene.json")) { throw "V17.600 base scene is missing" }

          $parts = @(Get-ChildItem "tools/assets/v17_603_scene_overlay" -Filter 'part-*.bin' | Sort-Object Name)
          if ($parts.Count -ne 43) { throw "Expected 43 committed V17.603 scene delta chunks, found $($parts.Count)" }
          $zipPath = "build-v17/v17.600-to-v17.603-scene-overlay.zip"
          New-Item -ItemType Directory -Force "build-v17" | Out-Null
          $out = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::Create)
          try { foreach ($part in $parts) { $bytes = [System.IO.File]::ReadAllBytes($part.FullName); $out.Write($bytes,0,$bytes.Length) } }
          finally { $out.Dispose() }
          $overlayRoot = "build-v17/v17.603-scene-overlay"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $overlayRoot -Force
          $overlayManifest = Get-Content "$overlayRoot/overlay_manifest.json" -Raw | ConvertFrom-Json
          if ($overlayManifest.format -ne "cse-warp-scene-delta-v17.600-to-v17.603") {
            throw "Unexpected V17.603 scene overlay format"
          }
          foreach ($relative in $overlayManifest.delete) {
            Remove-Item (Join-Path $approved $relative) -Force -ErrorAction SilentlyContinue
          }
          foreach ($relative in $overlayManifest.replace) {
            $source = Join-Path "$overlayRoot/benchmark-civic" $relative
            if (!(Test-Path $source)) { throw "V17.603 scene delta file missing: $relative" }
            $destination = Join-Path $approved $relative
            New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
            Copy-Item $source $destination -Force
          }

          $scene = Get-Content "$approved/scene.json" -Raw | ConvertFrom-Json
          if ($scene.revision -ne "V17.603") { throw "Expected V17.603 source scene, found $($scene.revision)" }
          $sector = $scene.sectors[0]
          $materials = Get-Content (Join-Path $approved $sector.materials[0]) -Raw | ConvertFrom-Json
          $pbr = Get-Content (Join-Path $approved $sector.pbr[0]) -Raw | ConvertFrom-Json
          if (@($materials.materials).Count -ne 148 -or @($pbr.sets).Count -ne 145) {
            throw "Wrong scene source: expected V17.603 with 148 materials and 145 PBR sets"
          }
          $instances = Get-Content (Join-Path $approved $sector.instances[0]) -Raw | ConvertFrom-Json
          $plants = @($instances.instances | Where-Object { $_.id -like 'v601_indoor_plant_*' })
          $positions = @($plants | ForEach-Object { "$($_.position[0]),$($_.position[1]),$($_.position[2])" } | Sort-Object -Unique)
          if ($plants.Count -ne 30 -or $positions.Count -ne 8 -or
              @($plants | Where-Object { $_.position[1] -ne 0.56 -or $_.position[2] -ne -14.0 }).Count -ne 0) {
            throw "V17.603 aligned indoor plants failed source-scene validation"
          }
          $trees = @($instances.instances | Where-Object { $_.id -like 'v600_garden_tree_*' })
          if ($trees.Count -ne 26) { throw "Expected 13 V17.603 plaza trees, found $($trees.Count) mesh instances" }
          $decks = @($instances.instances | Where-Object { $_.id -like 'v439_floor_deck_*' })
          $levels = @($decks | ForEach-Object { [math]::Round($_.position[1],3) } | Sort-Object -Unique)
          if ($decks.Count -ne 5 -or $levels.Count -ne 1 -or $levels[0] -ne 9.164) {
            throw "V17.603 floor-deck validation failed; only the approved middle level should remain"
          }
          if (@($instances.instances | Where-Object { $_.id -like 'rev_pot*' -or $_.id -like 'rev_pottree*' }).Count -ne 0) {
            throw "Superseded decorative planters were reintroduced"
          }
          Remove-Item "dist-v17/benchmark-civic" -Recurse -Force -ErrorAction Stop
          Copy-Item $approved "dist-v17/benchmark-civic" -Recurse -Force
          Remove-Item "dist-v17/audio" -Recurse -Force -ErrorAction SilentlyContinue
          @'
          CSE WARP BetaX — V17 package
          Default validated scene: V17.603 corrected palace.
          Scene source: frozen V17.600 Windows package plus the reviewed V17.603 scene delta.
          Indoor plants stay aligned beside the glazed facade; only the approved middle floor deck remains.
          Run LANCER_CSE_WARP.bat to open the scene.
          '@ | Set-Content "dist-v17/README.txt" -Encoding utf8
          Write-Host "READY: V17.603 source verified — 8 aligned plants, 13 plaza trees, middle floor only."
      - name: V17.493 - Enregistrer la nouvelle enseigne BASSEIN dans le paquet final
        shell: pwsh
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          M3D_V16_FORCE_WARP: '1'
