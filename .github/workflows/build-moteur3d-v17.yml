          Copy-Item "build-v17/v17-raster-warp-quick.png.baked-gi.png" "$comparison/raster-real-baked-gi.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced.png" "$comparison/raster-balanced-color.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced-085.png" "$comparison/raster-balanced-exposure-085.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.balanced-115.png" "$comparison/raster-balanced-exposure-115.png"
          Copy-Item "build-v17/v17-raster-warp-quick.png.color-metrics.csv" "$comparison/color-metrics.csv"
          $viewsFolder=Join-Path $comparison 'civic-camera-views'
          New-Item -ItemType Directory -Force $viewsFolder | Out-Null
          Get-ChildItem "build-v17/civic-views" -Recurse -Filter 'raster_*.png' | ForEach-Object {
            Copy-Item $_.FullName $viewsFolder
          }
      - name: Ten progressive native design passes — 55 real WARP camera renders and feedback
        shell: pwsh
        timeout-minutes: 35
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
        run: |
          node v17/tools/palais_ten_passes.cjs --scene scenes/v16/benchmark-civic --binary build-v17/Release/moteur3d_v17_benchmark.exe --output build-v17/total-simulation/palais-10-pass
          if ($LASTEXITCODE -ne 0) { throw 'Ten-pass real native WARP iteration failed' }
          $report = Get-Content build-v17/total-simulation/palais-10-pass/campaign-summary.json -Raw | ConvertFrom-Json
          if ($report.passesRendered -ne 10 -or !$report.baselineRendered) { throw 'Fewer than ten actual passes were rendered' }
          Write-Host "Ten native iterations completed: $($report.passesKept) kept, $($report.passesRolledBack) rolled back"
      - name: Archive des résultats de simulation totale WARP
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.${{ github.run_number }}-Total-Simulation-WARP
          path: build-v17/total-simulation/
          if-no-files-found: warn
      # The V17-specific scene-switch and D3D11 benchmark smoke checks have
      # already passed before we publish. Keep the complete inherited suite,
      # but do not delay users' access to the fully packaged Windows app.
      - name: Full V16 and V17 regression suite (post-package)
        run: ctest --test-dir build-v17 -C Release --verbose --output-on-failure
