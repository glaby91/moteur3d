name: Photo2Scene WARP — Energetik 3-view sparse QA
on:
  push:
    branches:
      - feature/energetik-palace-aerial-survey-261109
    paths:
      - tools/photo2scene/sparse_drone_3view.py
      - tools/photo2scene/tests/test_energetik_sparse_3view.py
      - tools/photo2scene/data/pripyat/energetik-drone-3view-rois.json
      - .github/workflows/photo2scene-energetik-sfm.yml
  pull_request:
    paths:
      - tools/photo2scene/sparse_drone_3view.py
      - tools/photo2scene/tests/test_energetik_sparse_3view.py
      - tools/photo2scene/data/pripyat/energetik-drone-3view-rois.json
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenCV numerical geometry and GLB support
        run: pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5' 'trimesh>=4,<5'
      - name: Validate Python CLI syntax
        run: |
          python -m py_compile tools/photo2scene/sparse_drone_3view.py
          python tools/photo2scene/sparse_drone_3view.py --help
      - name: Three-camera synthetic regression with separate holdout
        run: python tools/photo2scene/tests/test_energetik_sparse_3view.py
      - name: Validate source masks and nonmetric output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/photo2scene/data/pripyat/energetik-drone-3view-rois.json')
          d=json.loads(p.read_text())
          assert d['frame_seconds']==[373,374.25,375.5]
          assert all(len(d['roi_polygons_px'][str(t)])==4 for t in d['frame_seconds'])
          assert not list(Path('tools/photo2scene').glob('**/*.mp4'))
          print('ROI coverage PASS, no user-video published')
          PY
