name: Build route30 helper
on:
  push:
    branches: [benchmark/luminosity-audit-v1]
    paths: ['v17/tools/route30.cpp','.github/workflows/route30.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.309.0'
          install_runtime: false
          cache: true
          stripdown: true
          install_swiftshader: false
      - name: Build the native 720p route helper
        shell: pwsh
        run: |
          cmake -S v17 -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DM3D_REQUIRE_VULKAN=ON
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build --config Release --target v17_route30 v17_static_geometry_prepare_smoke --parallel 4
          if($LASTEXITCODE){exit $LASTEXITCODE}
          ctest --test-dir build -C Release -R "^v17_static_geometry_prepare_attributes$" --output-on-failure --no-tests=error
          if($LASTEXITCODE){exit $LASTEXITCODE}
          mkdir route30
          Copy-Item build/Release/route30.exe route30/
          Copy-Item build/v16/Release/moteur3d_v16_core.dll route30/
          Copy-Item build/Release/vulkan route30/vulkan -Recurse
          Compress-Archive route30/* route30.zip
          gh release create "route30-$env:GITHUB_SHA" route30.zip --target $env:GITHUB_SHA --prerelease --title "Benchmark parcours 30 secondes" --notes "Parcours 1280x720 en presentation native DX11, Vulkan et LumaTrace."
        env:
          GH_TOKEN: ${{ github.token }}
