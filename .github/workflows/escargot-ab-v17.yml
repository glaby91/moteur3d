name: CSE WARP V17.031 — Escargot 001 A-B
on:
  push:
    branches: [experiment/v17-escargot-001]
    paths:
      - '.github/workflows/escargot-ab-v17.yml'
      - 'v17/escargot/**'
      - 'v17/tools/escargot*'
      - 'v17/tests/escargot_smoke.cpp'
      - 'v17/CMakeLists.txt'
      - 'v17/moteur3d_v17_*.cpp'
      - 'v17/moteur3d_v17_render.h'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: escargot-ab-v17
  cancel-in-progress: true
jobs:
  windows-ab:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download exact scene V17.634
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "escargot-scene.zip"
          $root = Join-Path $env:RUNNER_TEMP "escargot-scene"
          Invoke-WebRequest "https://github.com/glaby91/moteur3d-scene/releases/download/scene-reflect-V17.634/V17-scene.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "f975639311e5b5d48ae996ac1f4f986994b232befb29617290f51bdf2bfbb703") { throw "Scene digest mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          "ESC_SCENE=$root/benchmark-civic" >> $env:GITHUB_ENV
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install Vulkan SDK for exploration application
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.309.0'
          install_runtime: false
          cache: true
          stripdown: true
          install_swiftshader: false
      - name: Configure and compile Escargot lab and A-B
        shell: pwsh
        run: |
          cmake -S v17 -B build-escargot -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DV17_SCENE_SOURCE_DIR=$env:ESC_SCENE" -DM3D_REQUIRE_VULKAN=ON "-DV17_CI_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER" "-DV17_GIT_SHA=$env:GITHUB_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-escargot --config Release --target v17_escargot_smoke v17_escargot_lab v17_escargot_ab v17_escargot_scale --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native C++ smoke
        shell: pwsh
        run: |
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          $smoke = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_smoke.exe | Select-Object -First 1
          if (!$core -or !$smoke) { throw "Missing binaries" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $smoke.FullName
          if ($LASTEXITCODE) { throw "Escargot smoke failed: $LASTEXITCODE" }
      - name: Package local A-B benchmark
        shell: pwsh
        run: |
          $dist = "escargot-package"
          New-Item -ItemType Directory -Force $dist | Out-Null
          foreach ($name in @("v17_escargot_ab.exe","v17_escargot_scale.exe","v17_escargot_lab.exe","v17_escargot_smoke.exe","moteur3d_v16_core.dll")) {
            $f = Get-ChildItem build-escargot -Recurse -File -Filter $name | Select-Object -First 1
            if (!$f) { throw "Missing $name" }
            Copy-Item $f.FullName $dist
          }
          Copy-Item v17/tools/LANCER_ESCARGOT_AB.bat $dist
          Copy-Item v17/tools/LANCER_ESCARGOT_SCALE.bat $dist
          Copy-Item docs/research/Z_ESCARGOT_001.md $dist
          Copy-Item engine/render_modules.json $dist
          New-Item -ItemType Directory -Force "$dist/materials" | Out-Null
          Copy-Item v17/materials/zmaterial8192.json "$dist/materials/"
          @{ engine="17.031"; module="Escargot001"; scene="V17.634"; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; nativePresentation=$false } | ConvertTo-Json | Set-Content "$dist/BUILD_INFO.json"
          windeployqt --release --no-translations "$dist/v17_escargot_ab.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.031-Escargot-AB-Windows-x64
          path: escargot-package/
          if-no-files-found: error
      - name: Compile exploration and integration smoke
        shell: pwsh
        run: |
          cmake --build build-escargot --config Release --target moteur3d_v17 v17_escargot_explore_smoke --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Interactive renderer QImage and native swapchain A F16 moved F16 A (WARP)
        shell: pwsh
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V17_ZREFLECT: '1'
          M3D_V17_ZATMOSPHERE: '0'
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter v17_escargot_explore_smoke.exe | Select-Object -First 1
          $core = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v16_core.dll | Select-Object -First 1
          if (!$exe -or !$core) { throw "Missing integration binaries" }
          $env:PATH="$($core.DirectoryName);$env:QT_ROOT_DIR/bin;$env:PATH"
          & $exe.FullName "$env:ESC_SCENE/scene.json"
          if ($LASTEXITCODE) { throw "Exploration integration failed: $LASTEXITCODE" }
      - name: Assemble engine-only exploration package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "escargot-exploration"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $exe = Get-ChildItem build-escargot -Recurse -File -Filter moteur3d_v17.exe | Select-Object -First 1
          if (!$exe) { throw "Missing application" }
          foreach ($name in @("moteur3d_v17.exe","moteur3d_v16_core.dll","audio","vulkan","shaders","render_modules.json","cse_warp_v17.ico")) {
            $src = Join-Path $exe.DirectoryName $name
            if (!(Test-Path $src)) { throw "Missing resource $name" }
            Copy-Item $src $dist -Recurse -Force
          }
          New-Item -ItemType Directory -Force "$dist/materials" | Out-Null
          Copy-Item v17/materials/zmaterial8192.json "$dist/materials/"
          @{ engine="17.031"; module="Escargot G F16 exploration"; scene="V17.634"; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; nativePresentation=$true; rayBudget=4096 } | ConvertTo-Json | Set-Content "$dist/BUILD_INFO.json"
          @'
          @echo off
          cd /d "%~dp0"
          set "CSE_WARP_ESCARGOT=1"
          set "M3D_V17_ZREFLECT=1"
          set "M3D_V16_FORCE_WARP="
          if "%~1"=="" (
            start "" "moteur3d_v17.exe"
          ) else (
            start "" "moteur3d_v17.exe" "%~1"
          )
          '@ | Set-Content "$dist/LANCER_ESCARGOT_EXPLORATION.bat" -Encoding ascii
          windeployqt --release --no-translations "$dist/moteur3d_v17.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path "$dist/platforms/qwindows.dll")) { throw "Missing Qt Windows plugin" }
          if (Test-Path "$dist/benchmark-civic") { throw "Unexpected scene in engine-only package" }
      - uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.031-Escargot-G-Exploration-Swapchain-Windows-x64
          path: escargot-exploration/
          if-no-files-found: error
      - name: Real scene A-B (WARP diagnostic)
        shell: pwsh
        timeout-minutes: 25
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force escargot-report | Out-Null
          & ".\escargot-package\v17_escargot_ab.exe" "$env:ESC_SCENE/scene.json" (Resolve-Path escargot-report).Path 320 180 3 4096
          $rc = $LASTEXITCODE
          if (Test-Path escargot-report/summary.json) { Get-Content escargot-report/summary.json }
          if ($rc) { throw "Escargot A/B failed: $rc" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Escargot-AB-V17.634-WARP-report
          path: escargot-report/
          if-no-files-found: warn
      - name: Scaling smoke (WARP diagnostic)
        shell: pwsh
        timeout-minutes: 15
        env:
          M3D_V16_FORCE_WARP: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\escargot-package\v17_escargot_scale.exe" "$PWD/escargot-scale-report" 320 180 1 4096
          $rc = $LASTEXITCODE
          if (Test-Path escargot-scale-report/summary.json) { Get-Content escargot-scale-report/summary.json }
          if ($rc) { throw "Escargot scale failed: $rc" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Escargot-scale-WARP-report
          path: escargot-scale-report/
          if-no-files-found: warn
