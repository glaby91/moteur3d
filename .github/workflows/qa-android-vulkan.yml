name: Android Vulkan emulator QA
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: android-x86_64-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
        with:
          packages: 'platform-tools'
      - name: Install screenshot verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # Generic AVD + explicit tablet viewport in QA; no profile ID dependency.
          cores: 4
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -feature Vulkan
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash experiments/android-vulkan/qa_emulator.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-emulator-vulkan-evidence
          path: android-evidence/
          if-no-files-found: warn
