name: QEDIT v0.4.2 save diagnostic
on:
  push:
    branches: [qedit-save-diagnostic-v0.4.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble
        run: |
          set -euo pipefail
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT.ROM | tee build-save-diagnostic.log
          test "$(stat -c%s QEDIT.ROM)" -eq 16384
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-v042-SAVE-DIAGNOSTIC
          path: |
            retro/cpc6128-qbasic/editor/QEDIT.ROM
            retro/cpc6128-qbasic/editor/build-save-diagnostic.log
          if-no-files-found: error
