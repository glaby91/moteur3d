name: Moteur3D V16 Pavillon01 Windows Qt6
on:
  push:
    branches:
      - feature/v16-modular-scene-dispatch
    paths:
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
      - 'scenes/v16/pavillon01/**'
      - 'tools/v16_scene_dispatch.py'
      - '.github/workflows/build-moteur3d-v16-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-v16:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 MSVC2022
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Pavillon 01 modular manifest
        shell: pwsh
        run: python tools/v16_scene_dispatch.py scenes/v16/pavillon01/scene.json --sector pavillon01

      - name: Configure MSVC / Qt6
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: cmake -S . -B build-v16 -G "Visual Studio 17 2022" -A x64

      - name: Compile V16 Qt application
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: cmake --build build-v16 --config Release --parallel

      - name: Install runtime scene and shaders
        shell: pwsh
        working-directory: experiments/2026-10-30-cote-ete-gt/native_v14
        run: |
          cmake --install build-v16 --config Release --prefix dist-v16
          if (!(Test-Path dist-v16/moteur3d_qt.exe)) { throw 'Missing V16 executable' }
          if (!(Test-Path dist-v16/scenes/v16/pavillon01/scene.json)) { throw 'Missing Pavillon01 scene manifest' }
          if (!(Test-Path dist-v16/shaders/m3d_raytrace_compute.hlsl)) { throw 'Missing compute shader' }
          windeployqt --release --compiler-runtime --dir dist-v16 dist-v16/moteur3d_qt.exe

      - name: Upload Windows executable and Pavillon 01
        uses: actions/upload-artifact@v4
        with:
          name: Moteur3D-V16-Pavillon01-Windows-${{ github.run_number }}
          path: experiments/2026-10-30-cote-ete-gt/native_v14/dist-v16/
          if-no-files-found: error
          retention-days: 30
