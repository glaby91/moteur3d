name: CSE WARP — V4 million triangles scene only
run-name: CSE WARP V4 — butte x2 centrée et huit rendus réels
on:
  push:
    branches:
      - feature/v17-378-central-mound-million-tris-261112
    paths:
      - 'scenes/v16/benchmark-civic/landscape_v4.py'
      - 'scenes/v16/benchmark-civic/make_v4_gallery.py'
      - '.github/workflows/scene-palais-v4-million-tris.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v17-v4-scene-million-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final-renders:
    name: Frozen V17.370, scene V4, eight native WARP views
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Image analysis dependencies
        shell: pwsh
        run: python -m pip install Pillow==11.3.0
      - name: Generate current V3 scene + validate original assets
        shell: pwsh
        run: |
          node scenes/v16/benchmark-civic/generate.cjs --all
          if ($LASTEXITCODE -ne 0) { throw 'V3 baseline generation failed' }
          node scenes/v16/benchmark-civic/validate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'V3 baseline validation failed' }
      - name: Geometric redesign V4 — double centered mound and ~1.1M triangles
        shell: pwsh
        run: |
          python scenes/v16/benchmark-civic/landscape_v4.py --root scenes/v16/benchmark-civic
          if ($LASTEXITCODE -ne 0) { throw 'V4 generation or budget failed' }
          $data = Get-Content scenes/v16/benchmark-civic/stats/v4-budget.json -Raw | ConvertFrom-Json
          if ($data.v4_triangles -lt 1000000 -or $data.v4_triangles -gt 1200000) { throw 'Incorrect triangle budget' }
          if ($data.mound_center_xyz[0] -ne 0 -or $data.footprint_scale -ne 2) { throw 'Mound is not centered and doubled' }
          Write-Host "REAL SCENE V4: $($data.v4_triangles) source triangles / $($data.v4_objects) objects"
      - name: Download unchanged Windows V17.370 engine from certified prior build
        uses: actions/download-artifact@v4
        with:
          name: CSE-WARP-V17.370-Windows-x64
          run-id: 43195320997
          repository: glaby91/moteur3d
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fixed-v17
      - name: Check engine frozen
        shell: pwsh
        run: |
          $exe = "fixed-v17/moteur3d_v17_benchmark.exe"
          if (!(Test-Path $exe)) { throw 'Frozen V17 executable missing' }
          $number = (Get-Content fixed-v17/BUILD_NUMBER.txt -Raw).Trim()
          if ($number -ne '370') { throw "Wrong engine V17.$number" }
          Write-Host 'ENGINE_FROZEN=V17.370; no CMake, no C++/HLSL changes'
      - name: Render final V4 from eight viewpoints — 1366x768 native DX11 WARP
        shell: pwsh
        timeout-minutes: 32
        env:
          M3D_V16_FORCE_WARP: '1'
          M3D_V16_GPU_GI_SAMPLES: '0'
          M3D_PRIMARY_RAYS_25: '0'
        run: |
          $exe = (Resolve-Path "fixed-v17/moteur3d_v17_benchmark.exe").Path
          $scene = (Resolve-Path "scenes/v16/benchmark-civic/scene-v4.json").Path
          $cameras = (Get-Content "scenes/v16/benchmark-civic/cameras/v4.json" -Raw | ConvertFrom-Json).cameras
          if ($cameras.Count -ne 8) { throw 'Expected eight physical camera viewpoints' }
          foreach ($camera in $cameras) {
            $hour = if ($camera.id -in @('v4_piscine','v4_hall')) { 19 } else { 14 }
            $dir = Join-Path "results/v4-renders/raw" $camera.id
            New-Item -ItemType Directory -Force $dir | Out-Null
            & $exe $scene $dir --quick --camera-id $camera.id --hour $hour
            if ($LASTEXITCODE -ne 0) { throw "Native WARP render failed: $($camera.id)" }
            $png = @(Get-ChildItem $dir -Recurse -Filter "raster_$($camera.id)_1366x768_depth1.png")
            if ($png.Count -ne 1 -or $png[0].Length -lt 4000) {
              throw "Missing valid high resolution PNG: $($camera.id)"
            }
            Copy-Item $png[0].FullName "results/v4-renders/$($camera.id).png"
            Write-Host "V4_REAL_VIEW $($camera.id): $($png[0].Length) bytes"
          }
      - name: Assemble V4 gallery, triangle measurements and eight native views
        shell: pwsh
        run: |
          python scenes/v16/benchmark-civic/make_v4_gallery.py --root scenes/v16/benchmark-civic --output results/v4-renders
          if ($LASTEXITCODE -ne 0) { throw 'Final gallery analysis failed' }
      - name: Package runnable reconstructed scene, preserving original artworks
        shell: pwsh
        run: |
          $root = "scenes/v16/benchmark-civic"
          $target = "results/v4-renders/pack/benchmark-civic"
          New-Item -ItemType Directory -Force $target | Out-Null
          foreach ($f in @(
            "geometry/benchmark.json", "instances/v4.json",
            "materials/pripyat-reuse.json", "pbr/pripyat-reuse-leger.json",
            "cameras/v4.json", "lighting/day.json", "environment/site.json",
            "textures/energetik_fresco_mosaic.jpg",
            "textures/personnage_facade_mosaique.jpg",
            "stats/v4-budget.json"
          )) {
            $dst = Join-Path $target $f
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            Copy-Item (Join-Path $root $f) $dst
          }
          Copy-Item (Join-Path $root "scene-v4.json") (Join-Path $target "scene.json")
          Set-Content "results/v4-renders/pack/README.txt" -Value @(
            "CSE WARP V17.370 — V4 landscape, centered 2x oval mound",
            "Unzip and open benchmark-civic/scene.json with existing V17.370 executable.",
            "The included scene alone is changed. Do not overwrite engine binaries.",
            "Contains original Energetik hall fresco and user-supplied outer mosaic."
          ) -Encoding UTF8
          Compress-Archive -Path "results/v4-renders/pack/benchmark-civic", "results/v4-renders/pack/README.txt" -DestinationPath "results/v4-renders/CSE-WARP-V17.370-SCENE-V4.zip"
          if (!(Test-Path "results/v4-renders/CSE-WARP-V17.370-SCENE-V4.zip")) { throw 'Missing scene pack' }
      - name: Upload eight real image renderings and performance proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V4-EIGHT-REAL-RENDERS-${{ github.run_number }}
          path: |
            results/v4-renders/*.png
            results/v4-renders/*.csv
            results/v4-renders/*.json
            scenes/v16/benchmark-civic/stats/v4-budget.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload scene V4 ready to load without engine rebuild
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17.370-SCENE-V4-${{ github.run_number }}
          path: results/v4-renders/CSE-WARP-V17.370-SCENE-V4.zip
          if-no-files-found: warn
          retention-days: 30
