name: Pripyat survey geometry tests
on:
  push:
    branches:
      - feature/pripyat-square-survey-measurements-261107
  pull_request:
    paths:
      - 'experiments/pripyat-survey/**'
      - '.github/workflows/pripyat-survey-tests.yml'
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Pripyat scene syntax
        run: node --check experiments/2026-10-30-cote-ete-gt/native_v14/scene_pripyat_central.js
      - name: Run metric geometry tests
        run: node experiments/pripyat-survey/test-pripyat-survey.mjs
