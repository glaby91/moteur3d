name: Compile LumaTrace V17 — Windows x64
run-name: LumaTrace V17 compile — ${{ github.sha }}
on:
  push:
    branches:
      - codex/v17-lumatrace-backend-test
      - codex/lumatrace-memory-allocation-fix-2026-11-22
      - codex/v17-scene-reference-release
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
      - '.github/workflows/compile-lumatrace-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compile-lumatrace-v17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: V17 + shared V16 engine — MSVC x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Install Vulkan 1.3 SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.309.0'
          install_runtime: false
          cache: true
          stripdown: true
          install_swiftshader: false
      - name: Scene preflight — download the latest standalone V17 scene
        id: scene_preflight
        shell: pwsh
        run: |
          $base = 'dist-v17-lumatrace'
          New-Item -ItemType Directory -Force $base | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'V17-scene.zip'
          $uri = 'https://github.com/glaby91/moteur3d-scene/releases/latest/download/V17-scene.zip'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if (!(Test-Path $archive) -or (Get-Item $archive).Length -lt 1000000) { throw 'Latest standalone V17 scene release is missing or incomplete.' }
          $unpack = Join-Path $env:RUNNER_TEMP 'V17-scene-latest'
          Expand-Archive -Path $archive -DestinationPath $unpack -Force
          $manifestPath = Join-Path $unpack 'SCENE_VERSION.json'
          $scenePath = Join-Path $unpack 'benchmark-civic/scene.json'
          if (!(Test-Path $manifestPath) -or !(Test-Path $scenePath)) { throw 'Latest scene package lacks SCENE_VERSION.json or benchmark-civic/scene.json.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $scene = Get-Content $scenePath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 1 -or $manifest.scene -ne 'benchmark-civic/scene.json' -or
              $manifest.revision -notmatch '^V17\.\d{3}$' -or $scene.revision -ne $manifest.revision) {
            throw 'Latest standalone scene package has an invalid or mismatched revision.'
          }
          Copy-Item (Join-Path $unpack 'benchmark-civic') (Join-Path $base 'benchmark-civic') -Recurse -Force
          Copy-Item $manifestPath (Join-Path $base 'SCENE_VERSION.json') -Force
          $versionText = "Revision: $($manifest.revision)`nSource commit: $($manifest.sourceCommit)`nRepository: $($manifest.repository)"
          Set-Content (Join-Path $base 'SCENE_VERSION.txt') $versionText -Encoding utf8
          "revision=$($manifest.revision)" | Add-Content $env:GITHUB_OUTPUT
          "source_commit=$($manifest.sourceCommit)" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "SCENE PREFLIGHT PASS: $($manifest.revision) from $($manifest.repository) at $($manifest.sourceCommit)."
          @"
          ## Standalone scene preflight: PASS

          - Selected reference scene: **$($manifest.revision)**
          - Scene repository: ``$($manifest.repository)``
          - Source commit: ``$($manifest.sourceCommit)``
          - Download URL: ``$uri``

          The same scene package is used regardless of the selected V17 render backend.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Configure V17
        shell: pwsh
        run: >-
          cmake -S v17 -B build-v17-lumatrace -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DM3D_REQUIRE_VULKAN=ON
          -DV17_CI_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER
          -DV17_GIT_SHA=$env:GITHUB_SHA
      - name: Compile V17 application and shared engine
        run: cmake --build build-v17-lumatrace --config Release --target moteur3d_v17 --parallel 4
      - name: Assemble the preflighted reference scene with every V17 backend
        shell: pwsh
        run: |
          $base = "dist-v17-lumatrace"
          $expectedSceneRevision = '${{ steps.scene_preflight.outputs.revision }}'
          $scenePath = Join-Path $base 'benchmark-civic/scene.json'
          $sceneRevision = (Get-Content $scenePath -Raw | ConvertFrom-Json).revision
          if ($sceneRevision -ne $expectedSceneRevision) { throw "Preflighted scene changed before assembly: expected $expectedSceneRevision, found $sceneRevision." }
          Write-Host "ASSEMBLY SCENE: $sceneRevision from scene commit ${{ steps.scene_preflight.outputs.source_commit }}."
          $exe = Get-ChildItem -Path build-v17-lumatrace -Recurse -Filter moteur3d_v17.exe | Select-Object -First 1
          $core = Get-ChildItem -Path build-v17-lumatrace -Recurse -Filter moteur3d_v16_core.dll | Select-Object -First 1
          if (-not $exe -or -not $core) { throw "The LumaTrace executable or V16 engine DLL is missing" }
          Copy-Item $exe.FullName (Join-Path $base "moteur3d_v17.exe") -Force
          Copy-Item $core.FullName (Join-Path $base "moteur3d_v16_core.dll") -Force
          $vulkanSource = Join-Path $exe.DirectoryName "vulkan"
          if (!(Test-Path $vulkanSource)) { throw "The Vulkan SPIR-V shaders were not generated" }
          New-Item -ItemType Directory -Force (Join-Path $base "vulkan") | Out-Null
          Copy-Item (Join-Path $vulkanSource "*") (Join-Path $base "vulkan") -Force
          if (!(Test-Path (Join-Path $base "pavillon01/scene.json"))) { throw "The façade-and-basin scene is missing" }
          if (!(Test-Path (Join-Path $base "benchmark-civic/scene.json"))) { throw "The default Pripyat scene is missing" }
          windeployqt --release --no-translations "$base/moteur3d_v17.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows x64 package
        uses: actions/upload-artifact@v6
        with:
          name: LumaTrace-V17-Windows-x64
          path: dist-v17-lumatrace/
          if-no-files-found: error
          compression-level: 6
