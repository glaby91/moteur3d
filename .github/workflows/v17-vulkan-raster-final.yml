name: CSE WARP V17 Vulkan 1.3.204+ Raster - final Windows compile
run-name: Vulkan Raster V17 - five-pass final Windows build
on:
  push:
    branches:
      - experiment/v17-vulkan-raster-backend-261114
    paths:
      - 'v17/**'
      - 'v16/**'
      - 'experiments/2026-10-30-cote-ete-gt/native_v14/**'
      - '.github/workflows/v17-vulkan-raster-final.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cse-warp-v17-vulkan-final
  cancel-in-progress: true
jobs:
  windows:
    name: Windows 2022 MSVC - Vulkan Raster shaders and A/B
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout V17 Vulkan branch
        uses: actions/checkout@v5
      - name: Install Qt6 desktop MSVC2022
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Install Vulkan SDK (no SwiftShader network dependency)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.309.0'
          cache: true
          stripdown: true
          install_swiftshader: false
      - name: Check Vulkan shader compiler and Qt
        shell: pwsh
        run: |
          $glslang = Join-Path $env:VULKAN_SDK 'Bin/glslangValidator.exe'
          if (!(Test-Path $glslang)) { throw "Vulkan SDK glslangValidator not found at $glslang" }
          & $glslang --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot run glslangValidator' }
          if (!(Test-Path (Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'))) {
            throw "Qt windeployqt not found"
          }
      - name: Prepare original V17 benchmark-civic generated scene
        shell: pwsh
        run: |
          node scenes/v16/benchmark-civic/generate.cjs --all
          if ($LASTEXITCODE -ne 0) { throw 'Scene generator failed' }
          node scenes/v16/benchmark-civic/validate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Scene validation failed' }
          python scenes/v16/benchmark-civic/landscape_v4.py --root scenes/v16/benchmark-civic
          if ($LASTEXITCODE -ne 0) { throw 'Scene landscape generation failed' }
      - name: Configure shared V17 engine with Vulkan enabled
        shell: pwsh
        run: |
          cmake -S v17 -B build-v17 -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DV17_BUILD_NUMBER=$env:GITHUB_RUN_NUMBER" "-DM3D_REQUIRE_VULKAN=ON"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: FINAL COMPILE - V17 Qt, shared core and Vulkan GPU tests
        id: compile
        shell: pwsh
        run: |
          cmake --build build-v17 --config Release --parallel 4 --target moteur3d_v17 v17_vulkan_mesh_smoke v17_vulkan_mipmap_smoke v17_vulkan_readback_smoke v17_vulkan_version_smoke v17_vulkan_gpu_smoke v17_vulkan_ab_bench
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan final Windows build failed' }
      - name: Assert always-on Vulkan Z-prepass contract
        if: ${{ steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          $renderer=Get-Content 'v17/vulkan/m3d_vulkan.cpp' -Raw
          $benchmark=Get-Content 'v17/vulkan/tests/vulkan_ab_bench.cpp' -Raw
          if ($renderer.Contains('CSE_WARP_VK_DEPTH_PREPASS')) { throw 'Unexpected Vulkan depth runtime switch' }
          if (!$renderer.Contains('drawOpaque(true);') -or !$renderer.Contains('drawOpaque(false);')) { throw 'Mandatory Vulkan opaque depth/color pass missing' }
          if (!$renderer.Contains('depthPipeline(&depthOpaque_') -or !$renderer.Contains('depthPipeline(&depthBox_') -or !$renderer.Contains('depthPipeline(&depthFoliage_')) { throw 'Depth-only shader pipelines missing' }
          if (!$benchmark.Contains('vulkan_depth_prepass_policy')) { throw 'Benchmark prepass metadata missing' }
          $skyVert=Get-Content 'v17/vulkan/shaders/sky.vert' -Raw
          $skyFrag=Get-Content 'v17/vulkan/shaders/sky.frag' -Raw
          if (!$skyVert.Contains('gl_Position=vec4(ndc,1.0,1.0)')) { throw 'Sky must be at far depth 1' }
          if (!$skyFrag.Contains('layout(early_fragment_tests) in;')) { throw 'Sky early-Z shader missing' }
          if (!$renderer.Contains('skyDepth.depthCompareOp=VK_COMPARE_OP_EQUAL')) { throw 'Sky must be depth-masked by opaque prepass' }
          $fragment=Get-Content 'v17/vulkan/shaders/raster.frag' -Raw
          if (!$renderer.Contains('sub.pResolveAttachments=') -or !$renderer.Contains('ms.rasterizationSamples=msaaSamples_')) { throw 'MSAA inline resolve missing' }
          if (!$renderer.Contains('ensureGI(scene);') -or !$fragment.Contains('sampler3D giCurrent')) { throw 'Baked GI 3D path missing' }
          if (!$fragment.Contains('fresnelWater') -or !$renderer.Contains('f.textureDetail[i][1]')) { throw 'Water shading missing' }
          $begin=$renderer.IndexOf('drawOpaque(true); // Mandatory')
          $skyDraw=$renderer.IndexOf('vkCmdDraw(cmd_,3,1,0,0);++drawCalls;')
          $opaqueColor=$renderer.IndexOf('drawOpaque(false); // Identical')
          if ($begin -lt 0 -or $skyDraw -le $begin -or $opaqueColor -le $skyDraw) { throw 'Sky must render between prepass and opaque color' }
          if (!$renderer.Contains('srgbColorEnabled_=!requestedSrgb')) { throw 'sRGB default policy missing' }
          if (!$renderer.Contains('CSE_WARP_VK_SRGB_COLOR_TEST=0')) { throw 'Legacy diagnostic override missing' }
          Write-Host 'PASS Vulkan always-on opaque Z-prepass source contract'
      - name: Confirm native Vulkan output and geometry smoke
        id: smoke
        if: ${{ steps.compile.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $exe='build-v17/Release'
          New-Item -ItemType Directory -Force 'diagnostics-vulkan' | Out-Null
          $qtBin=Join-Path $env:QT_ROOT_DIR 'bin'
          $vkBin=Join-Path $env:VULKAN_SDK 'Bin'
          $coreBin=(Resolve-Path 'build-v17/v16/Release').Path
          $env:PATH="$qtBin;$vkBin;$coreBin;$((Resolve-Path $exe).Path);$env:PATH"
          @("commit=$env:GITHUB_SHA", "qtBin=$qtBin", "vulkanBin=$vkBin", "coreBin=$coreBin") |
            Set-Content 'diagnostics-vulkan/environment.txt'
          Get-ChildItem $exe -Filter '*.dll' -Name |
            Out-File 'diagnostics-vulkan/dlls.txt'
          foreach ($p in @('moteur3d_v17.exe','moteur3d_v16_core.dll',
                        'v17_vulkan_gpu_smoke.exe','v17_vulkan_ab_bench.exe','v17_vulkan_mesh_smoke.exe','v17_vulkan_mipmap_smoke.exe','v17_vulkan_readback_smoke.exe','v17_vulkan_version_smoke.exe',
                        'vulkan/raster.vert.spv','vulkan/raster.frag.spv','vulkan/raster_fast.frag.spv','vulkan/sky.vert.spv','vulkan/sky.frag.spv',
                        'vulkan/raster_box.vert.spv','vulkan/raster_foliage.vert.spv')) {
            if (!(Test-Path "$exe/$p")) { throw "Missing Vulkan output: $p" }
            Write-Host "Verified: $p"
          }
          $failures=@()
          foreach ($name in @('v17_vulkan_mesh_smoke','v17_vulkan_mipmap_smoke','v17_vulkan_readback_smoke','v17_vulkan_version_smoke')) {
            Write-Host "Starting $name"
            & "$exe/$name.exe" *>&1 | Tee-Object -FilePath "diagnostics-vulkan/$name.txt"
            $exitCode=$LASTEXITCODE
            $exitHex=[Convert]::ToString([int]$exitCode,16).PadLeft(8,'0')
            $report="$name exit_code=$exitCode exit_hex=0x$exitHex"
            Write-Host $report
            Add-Content "diagnostics-vulkan/$name.txt" $report
            if($exitCode -ne 0) { $failures+= $report }
          }
          if($failures.Count -gt 0) {
            throw ("Vulkan smoke failure(s): " + ($failures -join '; '))
          }
          Write-Host 'GPU smoke intentionally not run on virtual runner: physical HD620 ICD required.'
      - name: Package executable for actual Intel HD620 test
        id: package
        if: ${{ always() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          $src='build-v17/Release'
          $dest='dist-v17-vulkan'
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($name in @('moteur3d_v17.exe','moteur3d_v16_core.dll',
                              'v17_vulkan_gpu_smoke.exe','v17_vulkan_ab_bench.exe','v17_vulkan_mesh_smoke.exe','v17_vulkan_mipmap_smoke.exe','v17_vulkan_readback_smoke.exe','v17_vulkan_version_smoke.exe')) {
            Copy-Item "$src/$name" "$dest/" -Force
          }
          Copy-Item "$src/vulkan" "$dest/vulkan" -Recurse -Force
          Copy-Item "$src/pavillon01" "$dest/pavillon01" -Recurse -Force
          Copy-Item "$src/material-lab" "$dest/material-lab" -Recurse -Force
          Copy-Item "$src/pripyat-photo2scene-proof" "$dest/pripyat-photo2scene-proof" -Recurse -Force
          Copy-Item "$src/benchmark-civic" "$dest/benchmark-civic" -Recurse -Force
          Copy-Item v17/vulkan/README.md "$dest/README_VULKAN.md"
          Copy-Item v17/vulkan/LANCER_AB_VULKAN_HD620.bat "$dest/LANCER_AB_VULKAN_HD620.bat"
          Copy-Item v17/vulkan/LANCER_OPTIMISATION_VULKAN_HD620.bat "$dest/LANCER_OPTIMISATION_VULKAN_HD620.bat"
          Copy-Item v17/vulkan/LANCER_PIPELINE_VULKAN_HD620.bat "$dest/LANCER_PIPELINE_VULKAN_HD620.bat"
          Copy-Item v17/vulkan/LANCER_ZPREPASS_VULKAN_HD620.bat "$dest/LANCER_ZPREPASS_VULKAN_HD620.bat"
          Copy-Item v17/vulkan/LANCER_QUALITE_VULKAN_MULTISCENE_HD620.bat "$dest/LANCER_QUALITE_VULKAN_MULTISCENE_HD620.bat"
          Copy-Item v17/vulkan/LANCER_SRGB_VULKAN_HD620.bat "$dest/LANCER_SRGB_VULKAN_HD620.bat"
          if (Test-Path 'diagnostics-vulkan') {
            Copy-Item 'diagnostics-vulkan' "$dest/diagnostics" -Recurse -Force
          }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$dest/moteur3d_v17.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Write-Host 'Package ready for Intel HD620 with installed Vulkan runtime 1.3.204.'
      - name: Publish experimental Vulkan Raster Windows bundle
        id: upload
        if: ${{ always() && steps.compile.outcome == 'success' && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: CSE-WARP-V17-Vulkan-1.3.204-Raster-Windows-HD620
          path: dist-v17-vulkan/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce smoke-test and publication status after diagnostic upload
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.compile.outcome }}' -ne 'success') { throw 'Vulkan compilation failed' }
          if ('${{ steps.package.outcome }}' -ne 'success') { throw 'Vulkan package creation failed' }
          if ('${{ steps.upload.outcome }}' -ne 'success') { throw 'Vulkan package upload failed' }
          if ('${{ steps.smoke.outcome }}' -ne 'success') { throw 'Vulkan smoke tests failed; diagnostics are included in uploaded artifact' }
          Write-Host 'All Vulkan CI checks passed; physical HD620 still requires local validation.'
