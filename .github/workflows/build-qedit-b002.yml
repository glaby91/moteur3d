name: Build QEDIT v0.4.2 B002 save bridge
on:
  push:
    branches: [qedit-v0.4.2-b002-save-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RASM
        run: |
          git clone --depth 1 --branch v3.2.4bis https://github.com/EdouardBERGE/rasm.git /tmp/rasm-src
          make -C /tmp/rasm-src release
      - name: Assemble
        run: |
          set -euo pipefail
          cd retro/cpc6128-qbasic/editor
          /tmp/rasm-src/rasm.exe QEDIT_ROM.asm -ob QEDIT_V042_B002.ROM | tee build-b002.log
          test "$(stat -c%s QEDIT_V042_B002.ROM)" -eq 16384
      - uses: actions/upload-artifact@v4
        with:
          name: QEDIT-v0.4.2-B002-SAVE-BRIDGE
          path: |
            retro/cpc6128-qbasic/editor/QEDIT_V042_B002.ROM
            retro/cpc6128-qbasic/editor/build-b002.log
          if-no-files-found: error
